    function useMedia(query) {
      const [match, setMatch] = useState(() => window.matchMedia(query).matches);
      useEffect(() => {
        const mq = window.matchMedia(query);
        const onChange = () => setMatch(mq.matches);
        mq.addEventListener("change", onChange);
        return () => mq.removeEventListener("change", onChange);
      }, [query]);
      return match;
    }

    // Scrollytelling: à esquerda as frentes de trabalho; à direita um palco fixo que mostra o artefato
    // do passo ativo (um por vez). O passo muda com a rolagem (Scrollama), com o mouse ou com o teclado.
    // No celular não há palco: cada passo mostra o próprio artefato.
    // shown: a aba desta lista está visível. O Scrollama só liga com ela à mostra, porque numa aba escondida
    // os passos medem altura zero e ele nunca dispararia.
    function XpScrolly({ items, shown = true }) {
      const [active, setActive] = useState(0);
      const wide = useMedia("(min-width: 992px)");
      const stepsRef = useRef(null);
      const lastScroll = useRef(0);

      // Enquanto a página rola, os passos passam por baixo do cursor parado e disparariam o "mouse entrou";
      // esse hover é ignorado para não brigar com a rolagem.
      useEffect(() => {
        const onScroll = () => { lastScroll.current = performance.now(); };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      const hoverTo = (i) => { if (wide && performance.now() - lastScroll.current > 250) setActive(i); };

      useEffect(() => {
        if (!wide || !shown) return;
        let scroller = null, dead = false, timer = 0;
        // espera um instante para a aba recém-mostrada ganhar altura antes de medir os passos
        loadXpLib("scrollama").then(() => { timer = setTimeout(() => {
          if (dead) return;
          scroller = scrollama();
          scroller.setup({ step: stepsRef.current.querySelectorAll(".xp-step"), offset: 0.5 }).onStepEnter(({ index }) => setActive(index));
        }, 80); }).catch(() => {});
        return () => { dead = true; clearTimeout(timer); if (scroller) scroller.destroy(); };
      }, [wide, shown]);

      const goTo = (i) => {
        setActive(i);
        const step = stepsRef.current.querySelectorAll(".xp-step")[i];
        if (step) step.scrollIntoView({ block: "center", behavior: prefersReducedMotion() ? "auto" : "smooth" });
      };

      const current = items[active];
      const StageArt = XP_ART[current.kind];
      return (
        <div className="xp-scrolly">
          <div className="xp-steps" ref={stepsRef}>
            {items.map((b, i) => {
              const Art = XP_ART[b.kind];
              return (
                <article
                  key={b.title}
                  className={`xp-step ${wide && i === active ? "is-active" : ""}`}
                  tabIndex={wide ? 0 : undefined}
                  onMouseEnter={() => hoverTo(i)}
                  onFocus={() => wide && setActive(i)}
                  onClick={() => wide && setActive(i)}
                >
                  <span className="xp-step-num">{pad2(i + 1)}</span>
                  <div className="xp-step-body">
                    <h4><i className={`bi ${b.icon}`} /> {b.title}</h4>
                    <p>{b.text}</p>
                    {b.link && (
                      <button type="button" className="xp-step-link link-arrow" onClick={(e) => { e.stopPropagation(); scrollToSection(b.link.to); }}>
                        {b.link.label} <i className="bi bi-arrow-up-right" />
                      </button>
                    )}
                    {!wide && Art && <div className="xp-step-art"><Art /></div>}
                  </div>
                </article>
              );
            })}
          </div>
          {wide && (
            <div className="xp-stage-col">
              <div className="xp-stage">
                <div className="xp-stage-hud">
                  <small>frente {pad2(active + 1)} / {pad2(items.length)}</small>
                  <strong key={current.title} className="fade-swap"><i className={`bi ${current.icon}`} /> {current.title}</strong>
                </div>
                <div className="xp-stage-art fade-swap" key={active}>{StageArt && <StageArt />}</div>
                <div className="xp-stage-dots" role="group" aria-label="Frentes de trabalho">
                  {items.map((b, i) => (
                    <button key={b.title} type="button" className={i === active ? "on" : ""} aria-label={b.title} aria-pressed={i === active} onClick={() => goTo(i)} />
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Inclinação 3D que segue o ponteiro (cartas e crachá do modo escuro). Grava ângulos e a posição do brilho em

    const tiltHandlers = {

    function Footer() {

        <footer className="footer">

            <span className="d-flex gap-3">
              <a href={PROFILE.github} target="_blank" rel="noopener noreferrer"><i className="bi bi-github me-1" />GitHub</a>
              <a href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer"><i className="bi bi-linkedin me-1" />LinkedIn</a>

    function ScrollChrome() {
      const barRef = useRef(null);
      const [showTop, setShowTop] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          const doc = document.documentElement;
          const max = doc.scrollHeight - doc.clientHeight;
          if (barRef.current) barRef.current.style.transform = `scaleX(${max > 0 ? doc.scrollTop / max : 0})`;
          setShowTop(doc.scrollTop > 700);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
      }, []);
      return (
        <>
          <div className="scroll-progress" ref={barRef} />
          <button className={`to-top ${showTop ? "show" : ""}`} onClick={() => window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? "auto" : "smooth" })} aria-label="Voltar ao topo">
            <i className="bi bi-arrow-up" />
          </button>
        </>
      );
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }

    // Modo escuro: as etiquetas das seções se "decodificam" quando entram na tela (GSAP ScrambleText).
    function useScrambleKickers(on) {
      useEffect(() => {
        if (!on || prefersReducedMotion()) return;
        let io = null, dead = false;
        loadXpLib("gsap").then(() => loadXpLib("scramble")).then(() => {
          if (dead) return;
          gsap.registerPlugin(ScrambleTextPlugin);
          io = new IntersectionObserver((entries) => entries.forEach((e) => {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            const el = e.target, text = el.dataset.text || el.textContent;
            el.dataset.text = text;
            gsap.to(el, { duration: 1.1, scrambleText: { text, chars: "01<>/#_[]", speed: 0.5, revealDelay: 0.15 } });
          }), { rootMargin: "0px 0px -15% 0px" });
          document.querySelectorAll(".sec-kicker, .cy-role-text").forEach((el) => io.observe(el));
        }).catch(() => {});
        return () => { dead = true; if (io) io.disconnect(); };
      }, [on]);
    }

    function App() {
      const [theme, toggleTheme] = useTheme();
      useScrambleKickers(theme === "dark");
      const active = useScrollSpy(["inicio", ...NAV.map((n) => n.id)]);

      useEffect(() => {

        return () => clearTimeout(t);
      }, []);

      const onCopy = async () => { await copyText(PROFILE.email); setToast(true); };

      return (
        <>

          <TopNav active={active} theme={theme} onToggleTheme={toggleTheme} />
          <GitGraph />

          <div className="main">
            <main>

              {theme === "dark" ? <AboutCyber /> : <About />}
              <RouteDivider target="niteroi" seed={0} />

              <Projects />
              <RouteDivider target="habilidades" seed={3} />
              {theme === "dark" ? <SkillsCyber /> : <Skills />}
              {theme === "dark" ? <ContactCyber onCopy={onCopy} /> : <Contact onCopy={onCopy} />}
            </main>
            <Footer />
          </div>
          <ToastContainer className="toast-dock p-3">
            <Toast show={toast} onClose={() => setToast(false)} delay={2200} autohide className="km-toast">
              <Toast.Body><i className="bi bi-check2-circle me-2" />E-mail copiado!</Toast.Body>
            </Toast>
          </ToastContainer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    // Diagnóstico: abra o site com ?diag no fim do endereço para ver um painel com o que o navegador está usando
    // (placa de vídeo, aceleração, escala da tela) e a fluidez de cada seção enquanto rola. O botão copia o resultado.
    (function () {
      if (!/[?&]diag\b/.test(location.search)) return;
      var ua = navigator.userAgent;
      var browser = (/Edg\/([\d]+)/.exec(ua) && "Edge " + RegExp.$1) || (/OPR\/([\d]+)/.exec(ua) && "Opera " + RegExp.$1) ||
        (/Firefox\/([\d]+)/.exec(ua) && "Firefox " + RegExp.$1) || (/Chrome\/([\d]+)/.exec(ua) && "Chrome " + RegExp.$1) ||
        (/Version\/([\d.]+).*Safari/.exec(ua) && "Safari " + RegExp.$1) || "desconhecido";
      var os = /Windows NT 10/.test(ua) ? "Windows 10/11" : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "macOS" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Linux/.test(ua) ? "Linux" : "?";
      var gpu = "WebGL indisponível", software = true;
      try {
        var gl = document.createElement("canvas").getContext("webgl");
        if (gl) {
          var ext = gl.getExtension("WEBGL_debug_renderer_info");
          gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
          software = /swiftshader|llvmpipe|basic render|software|microsoft basic/i.test(gpu);
        }
      } catch (e) {}
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var stats = {}, frames = 0, last = performance.now(), secStart = last, fps = 0;
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:99999;width:min(360px,calc(100vw - 24px));padding:12px 14px;border-radius:10px;background:rgba(10,10,20,.92);color:#e6f4ff;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 10px 30px rgba(0,0,0,.5)";
      document.body.appendChild(box);
      function section() {
        var mid = innerHeight * 0.45, list = document.querySelectorAll("section[id]");
        for (var i = 0; i < list.length; i++) { var r = list[i].getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) return list[i].id; }
        return "-";
      }
      function tick(now) {
        var dt = now - last; last = now; frames++;
        var s = stats[section()] || (stats[section()] = { n: 0, t: 0, slow: 0 });
        s.n++; s.t += dt; if (dt > 50) s.slow++;
        if (now - secStart >= 1000) { fps = Math.round(frames * 1000 / (now - secStart)); frames = 0; secStart = now; }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      function report() {
        var lines = [
          "navegador: " + browser + " · " + os,
          "tela: " + innerWidth + "×" + innerHeight + " · escala " + (devicePixelRatio || 1),
          "placa de vídeo: " + gpu,
          "aceleração de hardware: " + (software ? "DESLIGADA (o navegador desenha sem a placa de vídeo)" : "ligada"),
          "reduzir movimento: " + (reduced ? "ligado" : "desligado"),
          "tema: " + (document.documentElement.getAttribute("data-bs-theme") || "?"),
          "fluidez agora: " + fps + " quadros/s",
          "por seção (média · travadas):"
        ];
        Object.keys(stats).forEach(function (k) {
          var s = stats[k]; if (s.n < 20) return;
          lines.push("  " + k + ": " + Math.round(1000 / (s.t / s.n)) + " q/s · " + s.slow);
        });
        return lines.join("\n");
      }
      var pre = document.createElement("pre"); pre.style.cssText = "margin:0 0 8px;white-space:pre-wrap;font:inherit";
      var btn = document.createElement("button"); btn.type = "button"; btn.textContent = "copiar resultado";
      btn.style.cssText = "padding:6px 10px;border:1px solid #00e5ff;border-radius:6px;background:transparent;color:#00e5ff;font:inherit;cursor:pointer";
      btn.onclick = function () {
        var text = report();
        var done = function () { btn.textContent = "copiado!"; setTimeout(function () { btn.textContent = "copiar resultado"; }, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { prompt("copie o texto:", text); });
        else prompt("copie o texto:", text);
      };
      box.appendChild(pre); box.appendChild(btn);
      setInterval(function () { pre.textContent = report() + "\n\nrole a página inteira e troque de tema antes de copiar."; }, 500);
    })();
  </script>


</body>
</html>
