    /* ---------- Git graph vertical: o histórico do portfólio acompanha a rolagem ---------- */

    // Hash curto e estável (FNV-1a) para cada commit parecer de verdade.
    const fakeHash = (text) => {
      let h = 2166136261;
      for (const ch of text) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16).padStart(8, "0").slice(0, 7);
    };

    // Cada seção é um commit na main; Niterói e Projetos ganham um branch com os próprios commits.
    const GIT_MAIN = [{ id: "inicio", msg: "init" }, ...NAV.map((n) => ({ id: n.id, msg: n.label.toLowerCase() }))];
    const GIT_BRANCHES = {
      niteroi: { name: "feat/niteroi", color: "blue", commits: CITY_PROJECTS.map((p) => p.id) },
      projetos: { name: "feat/projetos", color: "good", commits: PROJECTS.map((p) => p.id) },
    };

    function GitGraph() {
      const boxRef = useRef(null);
      const progressRef = useRef(null);
      const headRef = useRef(null);
      const graphRef = useRef(null);
      const [graph, setGraph] = useState(null);

      // Monta o grafo: posição de cada commit conforme onde a seção começa na página.
      useEffect(() => {
        const box = boxRef.current;
        let raf = 0;
        const layout = () => {
          raf = 0;
          const w = box.clientWidth, h = box.clientHeight;
          if (!w || !h) return;
          const wide = w > 60;
          const x0 = wide ? 24 : 8, x1 = wide ? 46 : 17, labelX = 60;
          const top = 26, bottom = h - 26;
          const max = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
          const fracOf = (id) => {
            const el = document.getElementById(id);
            const y = el ? el.getBoundingClientRect().top + window.scrollY : 0;
            return Math.min(Math.max((y - window.innerHeight * 0.45) / max, 0), 1);
          };
          const yOf = (f) => top + f * (bottom - top);
          const nodes = [], branches = [];
          GIT_MAIN.forEach((c, i) => {
            const f = fracOf(c.id);
            nodes.push({ key: c.id, kind: i === 0 ? "root" : "main", ref: "main", x: x0, y: yOf(f), frac: f, hash: fakeHash(c.id), msg: c.msg, target: c.id });
            const br = GIT_BRANCHES[c.id];
            if (!br) return;
            const next = GIT_MAIN[i + 1];
            const fNext = next ? fracOf(next.id) : 1;
            const fMerge = f + (fNext - f) * 0.86;
            br.commits.forEach((msg, k) => {
              const fb = f + ((fMerge - f) * (k + 1)) / (br.commits.length + 1);
              nodes.push({ key: `${c.id}-${msg}`, kind: "branch", color: br.color, ref: br.name, x: x1, y: yOf(fb), frac: fb, hash: fakeHash(`${br.name}/${msg}`), msg, target: c.id, title: `${br.name}: ${msg}` });
            });
            nodes.push({ key: `${c.id}-merge`, kind: "merge", x: x0, y: yOf(fMerge), frac: fMerge, target: c.id, title: `Merge branch '${br.name}'` });
            branches.push({ name: br.name, color: br.color, fork: yOf(f), merge: yOf(fMerge), frac: f });
          });
          // Rótulos muito próximos se escondem (continuam no hover).
          let lastY = -Infinity;
          nodes.forEach((n) => {
            if (n.kind === "merge") return;
            n.crowded = n.y - lastY < 17;
            if (!n.crowded) lastY = n.y;
            n.dx = labelX - n.x;
          });
          const next = { x0, x1, top, bottom, nodes, branches };
          graphRef.current = next;
          setGraph(next);
        };
        const schedule = () => { if (!raf) raf = requestAnimationFrame(layout); };
        layout();
        const ro = new ResizeObserver(schedule);
        ro.observe(box);
        ro.observe(document.body);
        window.addEventListener("resize", schedule);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
        return () => { cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener("resize", schedule); };
      }, []);

      // O HEAD desce com a rolagem, faz checkout nos branches e acende os commits aplicados.
      useEffect(() => {
        let raf = 0;
        const ease = (t) => t * t * (3 - 2 * t);
        const headX = (g, y) => {
          for (const b of g.branches) {
            if (y < b.fork || y > b.merge) continue;
            const curve = 22;
            if (y < b.fork + curve) return g.x0 + (g.x1 - g.x0) * ease((y - b.fork) / curve);
            if (y > b.merge - curve) return g.x1 + (g.x0 - g.x1) * ease((y - (b.merge - curve)) / curve);
            return g.x1;
          }
          return g.x0;
        };
        const frame = () => {
          raf = 0;
          const g = graphRef.current;
          if (!g || !headRef.current || !progressRef.current) return;
          const max = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
          const p = Math.min(Math.max(window.scrollY / max, 0), 1);
          const y = g.top + p * (g.bottom - g.top);
          progressRef.current.setAttribute("y2", y);
          headRef.current.style.transform = `translate(${headX(g, y)}px, ${y}px) translate(-50%, -50%)`;
          headRef.current.style.setProperty("--spin", `${Math.round(window.scrollY * 0.3) % 360}deg`);
          let current = null;
          const nodes = boxRef.current.querySelectorAll(".git-node");
          nodes.forEach((n) => {
            const passed = p + 0.002 >= Number(n.dataset.frac);
            n.dataset.passed = passed ? "1" : "0";
            n.dataset.head = "0";
            if (passed && !n.classList.contains("k-merge")) current = n;
          });
          // O rótulo do HEAD tem duas linhas; os rótulos vizinhos que encostariam nele se escondem.
          const headY = current ? Number(current.dataset.y) : NaN;
          nodes.forEach((n) => { n.dataset.near = n !== current && Math.abs(Number(n.dataset.y) - headY) < 24 ? "1" : "0"; });
          if (current) current.dataset.head = "1";
          boxRef.current.querySelectorAll(".git-branch").forEach((b) => {
            b.dataset.on = p + 0.002 >= Number(b.dataset.frac) ? "1" : "0";
          });
        };
        const onScroll = () => { if (!raf) raf = requestAnimationFrame(frame); };
        frame();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => { cancelAnimationFrame(raf); window.removeEventListener("scroll", onScroll); };
      }, [graph]);

      const branchPath = (g, b) =>
        `M ${g.x0} ${b.fork} C ${g.x0} ${b.fork + 16} ${g.x1} ${b.fork + 6} ${g.x1} ${b.fork + 22} ` +
        `L ${g.x1} ${b.merge - 22} C ${g.x1} ${b.merge - 6} ${g.x0} ${b.merge - 16} ${g.x0} ${b.merge}`;

      return (
        <div className="git" ref={boxRef}>
          {graph && (
            <>
              <svg aria-hidden="true">
                <line className="git-track" x1={graph.x0} y1={graph.top} x2={graph.x0} y2={graph.bottom} />
                {graph.branches.map((b) => (
                  <path key={b.name} className={`git-branch c-${b.color}`} data-frac={b.frac} d={branchPath(graph, b)} />
                ))}
                <line ref={progressRef} className="git-progress" x1={graph.x0} y1={graph.top} x2={graph.x0} y2={graph.top} />
              </svg>
              {graph.nodes.map((n) => (
                <button
                  key={n.key}
                  type="button"
                  className={`git-node k-${n.kind} ${n.color ? `c-${n.color}` : ""}`}
                  data-frac={n.frac}
                  data-y={n.y}
                  style={{ left: n.x, top: n.y, "--dx": `${n.dx}px` }}
                  onClick={() => scrollToSection(n.target)}
                  title={n.title || `${n.hash} ${n.msg}`}
                  aria-label={`Ir para ${n.msg || n.title}`}
                >
                  {n.kind === "root" && "KM"}
                  {n.kind !== "merge" && (
                    <span className={`git-label ${n.crowded ? "is-crowded" : ""}`}>
                      <span className="ref">HEAD → <b>{n.ref}</b></span>
                      <span className="msg"><span className="h">{n.hash}</span>{n.msg}</span>
                    </span>
                  )}
                </button>
              ))}
            </>
          )}
          <div className="git-head" ref={headRef} aria-hidden="true"><i className="bi bi-git" /></div>
        </div>
      );
    }

    /* ---------- Mapa vivo de Niterói no fundo ---------- */

    // Ruas, orla e lagoas reais de Niterói (OpenStreetMap), no arquivo mapa-niteroi.svg ao lado desta página.
    // A rolagem passeia pelo mapa de bairro em bairro (um por seção) e o cursor acende as ruas como uma lanterna.
    const CITY_MAP = { src: "mapa-niteroi.svg", ratio: 2000 / 1225 };
    // x e y vão de 0 a 1 dentro do mapa; posições dos bairros tiradas do OpenStreetMap.
    const CITY_STOPS = [
      { id: "inicio", name: "Centro", x: 0.182, y: 0.2952 },
      { id: "sobre", name: "Icaraí", x: 0.2486, y: 0.4154 },
      { id: "niteroi", name: "São Francisco", x: 0.3336, y: 0.5238 },
      { id: "experiencia", name: "Charitas", x: 0.2883, y: 0.6105 },
      { id: "projetos", name: "Piratininga", x: 0.4133, y: 0.6799 },
      { id: "habilidades", name: "Camboinhas", x: 0.4697, y: 0.8118 },
      { id: "contato", name: "Itaipu", x: 0.581, y: 0.7619 },
    ];

    function CityMap() {
      const mapRef = useRef(null);
      const litRef = useRef(null);
      const lampRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        const LAMP = 160; // raio da lanterna
        let raf = 0, tops = [], mw = 0, mh = 0, tx = 0, ty = 0, mx = -9999, my = -9999;
        const canHover = window.matchMedia("(hover: hover)").matches;

        const measure = () => {
          // o mapa fica maior que a tela para dar espaço ao passeio entre os bairros
          const zoom = window.innerWidth < 768 ? 1.7 : 2;
          mw = Math.max(window.innerWidth, window.innerHeight * CITY_MAP.ratio) * zoom;
          mh = mw / CITY_MAP.ratio;
          [mapRef.current, litRef.current].forEach((el) => { el.style.width = `${mw}px`; el.style.height = `${mh}px`; });
          tops = CITY_STOPS.map((s) => {
            const el = document.getElementById(s.id);
            return el ? el.getBoundingClientRect().top + window.scrollY : 0;
          });
        };

        const placeLamp = () => {
          lampRef.current.style.transform = `translate3d(${mx - LAMP}px, ${my - LAMP}px, 0)`;
          litRef.current.style.transform = `translate3d(${tx - (mx - LAMP)}px, ${ty - (my - LAMP)}px, 0)`;
        };

        const frame = () => {
          raf = 0;
          const vw = window.innerWidth, vh = window.innerHeight;
          const y = window.scrollY + vh * 0.45;
          let i = 0;
          while (i < tops.length - 1 && y >= tops[i + 1]) i++;
          const j = Math.min(i + 1, tops.length - 1);
          const t = j === i ? 0 : Math.min(Math.max((y - tops[i]) / Math.max(tops[j] - tops[i], 1), 0), 1);
          const e = t * t * (3 - 2 * t);
          const a = CITY_STOPS[i], b = CITY_STOPS[j];
          tx = vw * 0.5 - (a.x + (b.x - a.x) * e) * mw;
          ty = vh * 0.5 - (a.y + (b.y - a.y) * e) * mh;
          mapRef.current.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
          const s = CITY_STOPS[t < 0.5 ? i : j];
          ringRef.current.style.transform = `translate3d(${tx + s.x * mw}px, ${ty + s.y * mh}px, 0)`;
          placeLamp();
        };
        const schedule = () => { if (!raf) raf = requestAnimationFrame(frame); };
        const onMove = (e) => {
          mx = e.clientX; my = e.clientY;
          lampRef.current.classList.add("on");
          schedule();
        };
        const onLeave = (e) => { if (!e.relatedTarget) lampRef.current.classList.remove("on"); };

        // desenha as ruas uma vez num canvas (o mapa e a lanterna), na cor do tema; só redesenha se a cor mudar
        let svgText = null, painted = "", dead = false;
        const paint = async () => {
          const css = getComputedStyle(document.documentElement);
          const ink = css.getPropertyValue("--map-ink").trim(), lit = css.getPropertyValue("--map-lit").trim();
          if (!ink || ink + lit === painted) return;
          painted = ink + lit;
          try {
            if (!svgText) svgText = await fetch(CITY_MAP.src).then((r) => r.text());
            const max = window.innerWidth < 768 ? 2048 : 3072;
            const w = Math.round(Math.min(max, mw * Math.min(window.devicePixelRatio || 1, 1.5))), h = Math.round(w / CITY_MAP.ratio);
            await Promise.all([[mapRef, ink], [litRef, lit]].map(async ([ref, color]) => {
              const url = URL.createObjectURL(new Blob([svgText.replace('stroke="#000"', `stroke="${color}"`)], { type: "image/svg+xml" }));
              try {
                const img = new Image();
                img.src = url;
                await img.decode();
                const cv = ref.current && ref.current.querySelector("canvas");
                if (dead || !cv) return;
                cv.width = w; cv.height = h;
                cv.getContext("2d").drawImage(img, 0, 0, w, h);
              } finally { URL.revokeObjectURL(url); }
            }));
          } catch (e) { painted = ""; }
        };
        const themeObs = new MutationObserver(() => paint());
        themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-bs-theme"] });

        measure();
        frame();
        paint();
        const ro = new ResizeObserver(() => { measure(); schedule(); });
        ro.observe(document.body);
        window.addEventListener("scroll", schedule, { passive: true });
        window.addEventListener("resize", schedule);
        if (canHover) {
          window.addEventListener("pointermove", onMove, { passive: true });
          document.addEventListener("mouseout", onLeave);
        }
        return () => {
          dead = true;
          cancelAnimationFrame(raf);
          ro.disconnect();
          themeObs.disconnect();
          window.removeEventListener("scroll", schedule);
          window.removeEventListener("resize", schedule);
          window.removeEventListener("pointermove", onMove);
          document.removeEventListener("mouseout", onLeave);
        };
      }, []);

      return (
        <div className="city-bg" aria-hidden="true">
          <div className="city-map" ref={mapRef}><canvas /></div>
          <div className="city-ring" ref={ringRef}><span /></div>
          <div className="city-lamp" ref={lampRef}><div className="city-map lit" ref={litRef}><canvas /></div></div>
        </div>
      );
    }

    /* ---------- Divisória entre seções: ciclovia com a NitBike ---------- */

    // A ciclovia se desenha com a rolagem e a bike pedala até a próxima seção; as paradas acendem ao passar.
    function RouteDivider({ target, seed = 0 }) {
      const boxRef = useRef(null);
      const pathRef = useRef(null);
      const progRef = useRef(null);
      const bikeRef = useRef(null);
      const stopRefs = useRef([]);
      const [w, setW] = useState(0);
      const [stops, setStops] = useState([]);
      const [done, setDone] = useState(false);
      const n = NAV.findIndex((s) => s.id === target);
      const H = 88, MID = 50;

      useEffect(() => {
        const ro = new ResizeObserver(() => setW(boxRef.current.clientWidth));
        ro.observe(boxRef.current);
        return () => ro.disconnect();
      }, []);

      // curvas suaves e diferentes em cada divisória
      const d = useMemo(() => {
        if (!w) return "";
        const x0 = 18, x1 = w - 10, parts = w < 600 ? 3 : 5;
        const amps = [14, 9, 17, 11, 15];
        let s = `M ${x0} ${MID}`;
        for (let k = 0; k < parts; k++) {
          const a = x0 + ((x1 - x0) * k) / parts, b = x0 + ((x1 - x0) * (k + 1)) / parts;
          const amp = amps[(k + seed) % amps.length] * ((k + seed) % 2 ? 1 : -1);
          s += ` C ${a + (b - a) * 0.35} ${MID + amp}, ${a + (b - a) * 0.65} ${MID + amp}, ${b} ${MID}`;
        }
        return s;
      }, [w, seed]);

      useEffect(() => {
        if (!d) return;
        const path = pathRef.current;
        const len = path.getTotalLength();
        setStops([0.33, 0.66].map((f) => { const p = path.getPointAtLength(len * f); return { f, x: p.x, y: p.y }; }));
        progRef.current.style.strokeDasharray = `${len}`;
        let raf = 0, wasDone = false;
        const frame = () => {
          raf = 0;
          const r = boxRef.current.getBoundingClientRect(), vh = window.innerHeight;
          const p = Math.min(Math.max((vh * 0.9 - (r.top + H / 2)) / (vh * 0.5), 0), 1);
          progRef.current.style.strokeDashoffset = `${len * (1 - p)}`;
          const at = path.getPointAtLength(len * p);
          const a = path.getPointAtLength(Math.max(0, len * p - 2));
          const b = path.getPointAtLength(Math.min(len, len * p + 2));
          const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
          bikeRef.current.style.transform = `translate(${at.x}px, ${at.y}px) translate(-50%, -50%) rotate(${ang}deg)`;
          stopRefs.current.forEach((el, k) => { if (el) el.dataset.passed = p >= [0.33, 0.66][k] ? "1" : "0"; });
          const isDone = p >= 0.999;
          if (isDone !== wasDone) { wasDone = isDone; setDone(isDone); }
        };
        const schedule = () => { if (!raf) raf = requestAnimationFrame(frame); };
        frame();
        window.addEventListener("scroll", schedule, { passive: true });
        window.addEventListener("resize", schedule);
        return () => { cancelAnimationFrame(raf); window.removeEventListener("scroll", schedule); window.removeEventListener("resize", schedule); };
      }, [d]);

      return (
        <div className="route" data-done={done ? "1" : "0"} aria-hidden="true">
          <Container fluid className="wrap h-100">
            <div className="route-box" ref={boxRef}>
              <svg>
                <path className="route-lane" d={d} />
                <path className="route-track" d={d} ref={pathRef} />
                <path className="route-progress" d={d} ref={progRef} />
                {stops.map((s, k) => <circle key={s.f} className="route-stop" cx={s.x} cy={s.y} r="6" ref={(el) => (stopRefs.current[k] = el)} />)}
              </svg>
              <div className="route-bike" ref={bikeRef}><i className="bi bi-bicycle" /></div>
              <button type="button" className="route-end" tabIndex={-1} onClick={() => scrollToSection(target)}>
                <span className="mono">próxima parada</span> {pad2(n + 1)} {NAV[n].label} <i className="bi bi-arrow-down" />
              </button>
            </div>
          </Container>
        </div>
      );
    }

    const CODE_LINES = [
      { i: 0, c: <><span className="tok-kw">class</span> <span className="tok-cls">Kluivert</span>(<span className="tok-cls">DevPython</span>):</> },
      { i: 1, c: <>base <span className="tok-op">=</span> <span className="tok-str">"São Gonçalo, RJ"</span></> },
      { i: 1, c: <>agora <span className="tok-op">=</span> (<span className="tok-str">"Escritório de Dados da "</span></> },
      { ch: 13, c: <><span className="tok-str">"Prefeitura de Niterói"</span>)</> },
      { i: 1, c: <>stack <span className="tok-op">=</span> [<span className="tok-str">"Python"</span>, <span className="tok-str">"SQL"</span>, <span className="tok-str">"FastAPI"</span>]</> },
      { i: 1, c: <>foco <span className="tok-op">=</span> [<span className="tok-str">"backend"</span>, <span className="tok-str">"dados"</span>, <span className="tok-str">"IA"</span>]</> },
      { i: 0, c: <>{" "}</> },
      { i: 1, c: <><span className="tok-kw">def</span> <span className="tok-fn">entregar</span>(<span className="tok-self">self</span>, ideia):</> },
      { i: 2, c: <span className="tok-cm"># do código ao deploy</span> },
      { i: 2, c: <><span className="tok-kw">return</span> <span className="tok-fn">deploy</span>(<span className="tok-fn">testar</span>(<span className="tok-fn">api</span>(ideia)))</> },
    ];

    function CodeCard() {

    // Modo escuro: o MAC de Niterói em holograma sobre a grade da baía, com a cidade em wireframe atrás e chuva.
    // O prédio vem de mac-niteroi.glb, modelado no Blender com as medidas do MAC (16 m de altura, cúpula de 50 m,
    // pilar de 9 m, espelho d'água de 817 m² e a rampa sinuosa). Um anel escaneia o prédio de baixo para cima.
    const MAC_VERT = `
      varying vec3 vN; varying vec3 vW; varying vec3 vL;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz; vL = position; vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * w;
      }`;
    const MAC_FRAG = `
      uniform vec3 uColor; uniform float uTime; uniform float uScan; uniform float uBase; uniform float uKind;
      varying vec3 vN; varying vec3 vW; varying vec3 vL;
      void main() {
        vec3 v = normalize(cameraPosition - vW);
        float fres = pow(1.0 - abs(dot(normalize(vN), v)), 2.0);
        float lines = smoothstep(0.35, 0.0, abs(fract(vW.y * 26.0 - uTime * 0.5) - 0.5)) * 0.2 * (1.0 - abs(normalize(vN).y));
        float scan = smoothstep(0.1, 0.0, abs(vW.y - uScan));
        float glow = uBase + fres * 0.5 + lines * 0.7 + scan * 0.75;
        if (uKind > 0.5) {
          float ang = atan(vL.z, vL.x) / 6.2831853 + 0.5;
          glow = mix(0.42 + fres * 0.3 + scan * 0.6, 0.06, step(0.8, fract(ang * 72.0)));
        }
        float flick = 0.94 + 0.06 * sin(uTime * 31.0 + vW.y * 7.0);
        gl_FragColor = vec4(uColor * (0.3 + glow), clamp(glow * 0.62, 0.0, 1.0) * flick);
      }`;
    const POOL_FRAG = `
      uniform vec3 uColor; uniform float uTime; varying vec3 vL;
      void main() {
        float r = length(vL.xz);
        float ring = 1.0 - smoothstep(0.0, 0.05, 0.5 - abs(fract(r * 4.0 - uTime * 0.35) - 0.5));
        float a = 0.1 + ring * 0.38 + smoothstep(1.4, 1.6, r) * 0.5;
        gl_FragColor = vec4(uColor, a * (1.0 - smoothstep(1.6, 1.63, r)));
      }`;
    // perfil do prédio (raio, altura) em unidades de 10 m, o mesmo do modelo: usado para os meridianos do desenho técnico
    const MAC_PROFILE = [[0.45, 0], [0.45, 0.27], [0.6, 0.3], [0.85, 0.42], [1.74, 0.94], [2.1, 1.17], [2.5, 1.44], [2.5, 1.5], [2.44, 1.55]];

    function CyberCity() {
      const ref = useRef(null);
      useEffect(() => {
        let dead = false, cleanup = () => {};
        Promise.all([import("three"), import("three/addons/loaders/GLTFLoader.js")]).then(([THREE, { GLTFLoader }]) => {
          const canvas = ref.current;
          if (dead || !canvas) return;
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
          renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
          const scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x07051a, 0.018);
          const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 260);
          const CYAN = 0x00e5ff, PINK = 0xff2bd6, ORANGE = 0xff7a1a;
          let seed = 11;
          const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

          const shared = { uTime: { value: 0 }, uScan: { value: 0 } };
          // a baía: mar escuro com uma malha de néon e ondas que correm pela superfície
          const SEA = -1.3;
          const seaMat = new THREE.ShaderMaterial({
            uniforms: { uTime: shared.uTime },
            vertexShader: MAC_VERT,
            fragmentShader: `
              uniform float uTime; varying vec3 vW;
              void main() {
                vec2 p = vW.xz;
                vec2 q = vec2(fract(p.x * .5), fract(p.y * .5 + uTime * .08));
                float g = 1. - smoothstep(0., .035, min(.5 - abs(q.x - .5), .5 - abs(q.y - .5)));
                float wave = smoothstep(.0, .9, sin(p.x * .7 + p.y * .4 + uTime * 1.3) * sin(p.y * .9 - uTime * .7));
                float fade = exp(-length(p - vec2(2., -8.)) * .035);
                vec3 c = mix(vec3(.23, .12, .48), vec3(1., .17, .84), g * .6) * g * .55 + vec3(0., .9, 1.) * wave * .12;
                gl_FragColor = vec4(c, (g * .5 + wave * .14) * fade);
              }`,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
          });
          const sea = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), seaMat);
          sea.rotation.x = -Math.PI / 2; sea.position.y = SEA;
          scene.add(sea);

          const mac = new THREE.Group();
          scene.add(mac);
          const holo = (color, base, kind = 0) => new THREE.ShaderMaterial({
            uniforms: { uTime: shared.uTime, uScan: shared.uScan, uColor: { value: new THREE.Color(color) }, uBase: { value: base }, uKind: { value: kind } },
            vertexShader: MAC_VERT, fragmentShader: MAC_FRAG, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          });
          const lines = (color, opacity, fog = true) => new THREE.LineBasicMaterial({ color, transparent: true, opacity, fog });
          // piso da esplanada: as juntas das placas em grade, como na foto
          const plazaMat = new THREE.ShaderMaterial({
            uniforms: { uTime: shared.uTime, uColor: { value: new THREE.Color(0x7a5cff) } },
            vertexShader: MAC_VERT,
            fragmentShader: `
              uniform vec3 uColor; uniform float uTime; varying vec3 vW;
              void main() {
                vec2 p = vW.xz * 2.2;
                float g = 1. - smoothstep(0., .05, min(.5 - abs(fract(p.x) - .5), .5 - abs(fract(p.y) - .5)));
                gl_FragColor = vec4(uColor, .02 + g * .45);
              }`,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          });
          const scan = new THREE.Mesh(new THREE.TorusGeometry(2.75, 0.018, 6, 160), new THREE.MeshBasicMaterial({ color: CYAN, transparent: true }));
          scan.rotation.x = Math.PI / 2; mac.add(scan);
          // meridianos do desenho técnico sobre o prédio
          const mer = [];
          for (let i = 0; i < 40; i++) {
            const a = (i / 40) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
            for (let k = 0; k < MAC_PROFILE.length - 1; k++) {
              const [r0, y0] = MAC_PROFILE[k], [r1, y1] = MAC_PROFILE[k + 1];
              mer.push(r0 * c, y0, r0 * s, r1 * c, y1, r1 * s);
            }
          }
          const merGeo = new THREE.BufferGeometry();
          merGeo.setAttribute("position", new THREE.Float32BufferAttribute(mer, 3));
          mac.add(new THREE.LineSegments(merGeo, lines(CYAN, 0.32)));

          // a versão no endereço faz o navegador baixar o modelo de novo quando ele muda
          new GLTFLoader().load("mac-niteroi.glb?v=14", (gltf) => {
            if (dead) return;
            const add = [];
            gltf.scene.traverse((o) => {
              if (!o.isMesh) return;
              const n = o.name, g = o.geometry;
              if (/^MAC_Espelho/.test(n)) o.material = new THREE.ShaderMaterial({ uniforms: { uTime: shared.uTime, uColor: { value: new THREE.Color(CYAN) } }, vertexShader: MAC_VERT, fragmentShader: POOL_FRAG, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
              else if (/^MAC_Janelas/.test(n)) o.material = holo(0xbff8ff, 0.2, 1);
              else if (/^MAC_Rampa/.test(n)) { o.material = holo(0xff2b5e, 0.34); add.push([o, lines(0xff6b8f, 1)]); }
              else if (/^MAC_/.test(n)) { o.material = holo(CYAN, 0.05); add.push([o, lines(CYAN, 0.75)]); }
              else if (/^Mirante_Esplanada/.test(n)) o.material = plazaMat;
              // o Cristo Redentor aceso no alto do Corcovado
              else if (/^Rio_Cristo/.test(n)) { o.material = holo(0xe8fbff, 0.45); add.push([o, lines(0xffffff, 1, false)]); }
              else if (/^Mirante_|^Ilhota|^Ilha_Pedra/.test(n)) { o.visible = false; add.push([o, lines(0x7d6bff, 0.5)]); }
              // Ilha da Boa Viagem: o morro em malha roxa como os outros morros, o costão um pouco mais claro,
              // a igreja e a escadaria acesas, a passarela em ciano e a espuma das ondas em branco
              else if (/^Ilha_Terreno/.test(n)) { o.visible = false; add.push([o, lines(0x6b4dff, 0.5, false), "wire"]); }
              else if (/^Ilha_Rocha/.test(n)) { o.visible = false; add.push([o, lines(0x8f7dff, 0.55, false), "wire"]); }
              else if (/^Ilha_(Igreja|Torre|Adro)/.test(n)) { o.material = holo(0xfff6e0, 0.4); add.push([o, lines(0xffffff, 1, false)]); }
              else if (/^Ilha_Escada/.test(n)) { o.material = holo(0xe8fbff, 0.25); add.push([o, lines(0xe8fbff, 0.5, false)]); }
              // a passarela em destaque, com os pilares descendo até o mar e a areia
              else if (/^Ilha_Ponte_Cabeceira/.test(n)) { o.material = holo(CYAN, 0.04); add.push([o, lines(CYAN, 0.6)]); }
              else if (/^Ilha_Ponte/.test(n)) { o.material = holo(0x8ff6ff, 0.45); add.push([o, lines(0xd8fdff, 1, false)]); }
              else if (/^Ilha_Pilares/.test(n)) { o.material = holo(CYAN, 0.35); add.push([o, lines(0x8ff6ff, 0.85, false)]); }
              else if (/^Praia/.test(n)) { o.material = holo(0xffcf6e, 0.1); add.push([o, lines(0xffd98a, 0.7, false)]); }
              else if (/^Ilha_Espuma/.test(n)) { o.visible = false; add.push([o, lines(0xd8f6ff, 0.45)]); }
              else if (/^Mata/.test(n)) {
                // vegetação como nuvem de pontos verdes
                o.visible = false;
                add.push([o, new THREE.PointsMaterial({ color: 0x39ff9c, size: 0.06, transparent: true, opacity: 0.75 }), "points"]);
              }
              // a orla do Rio acesa; os bairros de Niterói mais apagados, para a ilha e o MAC se destacarem
              else if (/^Rio_Predios_/.test(n)) { o.visible = false; add.push([o, lines(ORANGE, 0.22, false), "edges"]); }
              else if (/^Rio_Predios/.test(n)) { o.visible = false; add.push([o, lines(ORANGE, 0.55, false), "edges"]); }
              else if (/^Rio_|^Niteroi_/.test(n)) { o.visible = false; add.push([o, lines(0x6b4dff, 0.5, false), "wire"]); }
            });
            add.forEach(([o, m, kind]) => {
              let obj;
              if (kind === "points") obj = new THREE.Points(o.geometry, m);
              else if (kind === "wire") obj = new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry), m);
              else obj = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), m);
              obj.position.copy(o.position); obj.quaternion.copy(o.quaternion); obj.scale.copy(o.scale);
              o.parent.add(obj);
            });
            mac.add(gltf.scene);
          });

          // chuva
          const N = 720, rain = new Float32Array(N * 6);
          for (let i = 0; i < N; i++) {
            const x = (rnd() - 0.5) * 22, y = rnd() * 11, z = (rnd() - 0.5) * 18 - 1;
            rain.set([x, y, z, x - 0.04, y - 0.4, z], i * 6);
          }
          const rainGeo = new THREE.BufferGeometry();
          rainGeo.setAttribute("position", new THREE.BufferAttribute(rain, 3));
          scene.add(new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.25 })));

          // a barca: atravessa a faixa escura da baía entre o Rio e Niterói, com as janelas acesas e a esteira atrás
          const boat = new THREE.Group();
          // retângulo de cantos redondos visto de cima, para os conveses
          const deckShape = (w, d, r) => {
            const sh = new THREE.Shape(), x = w / 2, z = d / 2;
            sh.moveTo(-x + r, -z); sh.lineTo(x - r, -z); sh.quadraticCurveTo(x, -z, x, -z + r); sh.lineTo(x, z - r);
            sh.quadraticCurveTo(x, z, x - r, z); sh.lineTo(-x + r, z); sh.quadraticCurveTo(-x, z, -x, z - r); sh.lineTo(-x, -z + r);
            sh.quadraticCurveTo(-x, -z, -x + r, -z);
            return sh;
          };
          const lift = (sh, h, bevel = 0) => {
            const g = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 10 });
            g.rotateX(-Math.PI / 2);
            return g;
          };
          // casco com a proa afinando em curva
          const hullShape = new THREE.Shape();
          hullShape.moveTo(1.1, -.3); hullShape.lineTo(-.55, -.3);
          hullShape.bezierCurveTo(-1.0, -.3, -1.25, -.12, -1.32, 0); hullShape.bezierCurveTo(-1.25, .12, -1.0, .3, -.55, .3);
          hullShape.lineTo(1.1, .3); hullShape.quadraticCurveTo(1.2, .3, 1.2, .2); hullShape.lineTo(1.2, -.2); hullShape.quadraticCurveTo(1.2, -.3, 1.1, -.3);
          const boatParts = [
            [lift(hullShape, .16, .03), 0x8ff6ff, 0.16, [0, 0, 0]],
            [lift(deckShape(1.5, .46, .16), .2), 0xe8fbff, 0.18, [.12, .2, 0]],
            [lift(deckShape(.85, .36, .14), .16), 0xe8fbff, 0.18, [.3, .4, 0]],
          ];
          boatParts.forEach(([g, c, b, pos]) => {
            const m = new THREE.Mesh(g, holo(c, b)); m.position.set(...pos); boat.add(m);
            const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), lines(0xd8fdff, 0.7, false)); e.position.copy(m.position); boat.add(e);
          });
          // faixas de janelas acesas nos dois conveses
          const glow = new THREE.MeshBasicMaterial({ color: 0xffb45e, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
          [[1.2, .32, .235, .12], [.62, .5, .185, .3]].forEach(([len, y, z, x]) => {
            for (const sgn of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(len, .055), glow); w.position.set(x, y, sgn * z); boat.add(w); }
          });
          // mastro com a luz branca no topo e as luzes de navegação na proa (vermelha a bombordo, verde a boreste)
          boat.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(.45, .56, 0), new THREE.Vector3(.45, .86, 0)]), lines(0xd8fdff, 0.8, false)));
          const lgGeo = new THREE.BufferGeometry();
          lgGeo.setAttribute("position", new THREE.Float32BufferAttribute([.45, .88, 0, -.55, .26, -.2, -.55, .26, .2], 3));
          lgGeo.setAttribute("color", new THREE.Float32BufferAttribute([1, 1, 1, 1, .2, .3, .2, 1, .55], 3));
          boat.add(new THREE.Points(lgGeo, new THREE.PointsMaterial({ size: .1, vertexColors: true, transparent: true, fog: false })));
          // esteira: um V que se abre atrás da popa e some aos poucos
          const wake = [], wakeCols = [];
          for (let k = 0; k < 12; k++) {
            const a = k / 12, b = (k + 1) / 12, fa = 1 - a, fb = 1 - b;
            for (const sgn of [-1, 1]) {
              wake.push(1.2 + a * 3.6, .02, sgn * (.26 + a * 1.1), 1.2 + b * 3.6, .02, sgn * (.26 + b * 1.1));
              wakeCols.push(fa * .6, fa * .75, fa * .8, fb * .6, fb * .75, fb * .8);
            }
            wake.push(1.2 + a * 3.6, .02, 0, 1.2 + b * 3.6, .02, 0);
            wakeCols.push(fa * .35, fa * .45, fa * .55, fb * .35, fb * .45, fb * .55);
          }
          const wkGeo = new THREE.BufferGeometry();
          wkGeo.setAttribute("position", new THREE.Float32BufferAttribute(wake, 3));
          wkGeo.setAttribute("color", new THREE.Float32BufferAttribute(wakeCols, 3));
          boat.add(new THREE.LineSegments(wkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, fog: false })));
          boat.scale.setScalar(1.05);
          scene.add(boat);

          let mx = 0, my = 0, raf = 0, on = false, last = 0;
          const still = prefersReducedMotion();
          const resize = () => {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (!w || !h) return;
            renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
          };
          const draw = (ms) => {
            const t = ms / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
            last = t;
            shared.uTime.value = t;
            // a câmera passeia devagar pelo alto, como um drone, de onde a foto do Mirante é tirada
            // enquadramento da foto: o MAC na frente, a Ilha da Boa Viagem à direita e o Pão de Açúcar ao fundo
            // vista do sul, como a foto aérea: o MAC na frente, o Pão de Açúcar atrás e a Ilha da Boa Viagem à direita
            // do sul: o MAC, a passarela vista de lado ligando o Mirante à ilha e o Cristo no alto
            camera.position.set(4 + Math.sin(t * 0.09) * 1.2 + mx * 2, 7.6 - my * 0.8, 27.5);
            camera.lookAt(1.6, 0.9, -3.5);
            const s = (Math.sin(t * 0.8) + 1) / 2;
            scan.position.y = 0.05 + s * 1.55; scan.material.opacity = 0.3 + 0.7 * Math.sin(s * Math.PI);
            shared.uScan.value = scan.position.y;
            const p = rainGeo.attributes.position.array;
            for (let i = 0; i < N; i++) {
              const o = i * 6;
              p[o + 1] -= dt * 9; p[o + 4] -= dt * 9;
              if (p[o + 4] < 0) { p[o + 1] += 11; p[o + 4] += 11; }
            }
            rainGeo.attributes.position.needsUpdate = true;
            // a barca vai do Rio para o oeste da baía num laço de uns 70 s, balançando nas ondas
            const u = (t * 1.05 + 26) % 76; // começa já no meio da baía, à vista
            boat.position.set(44 - u, SEA + .08 + Math.sin(t * 1.6) * .035, -36 + Math.sin(u * .07) * 1.4);
            boat.rotation.set(Math.sin(t * 1.3) * .025, Math.cos(u * .07) * .07, Math.sin(t * 1.1) * .03);
            renderer.render(scene, camera);
          };
          const loop = (ms) => { draw(ms); if (on) raf = requestAnimationFrame(loop); };
          const onMove = (e) => { mx = e.clientX / window.innerWidth - 0.5; my = e.clientY / window.innerHeight - 0.5; };
          resize();
          draw(4000);
          const io = new IntersectionObserver(([e]) => {
            on = e.isIntersecting && !still;
            cancelAnimationFrame(raf);
            if (on) raf = requestAnimationFrame(loop);
            else draw(performance.now());
          });
          io.observe(canvas);
          window.addEventListener("resize", resize);
          window.addEventListener("pointermove", onMove, { passive: true });
          cleanup = () => {
            on = false; cancelAnimationFrame(raf); io.disconnect();
            window.removeEventListener("resize", resize); window.removeEventListener("pointermove", onMove);
            renderer.dispose();
          };
        }).catch(() => {});
        return () => { dead = true; cleanup(); };
      }, []);
      return <div className="cy-city" aria-hidden="true"><canvas ref={ref} /></div>;
    }

    function HeroCyber() {
      const roles = PROFILE.roles.join("  ◆  ") + "  ◆  ";
      return (
        <section id="inicio" className="cy-hero">

    /* ---------- Holograma 3D das camadas (Three.js) ---------- */

    const HOLO_COLORS = { accent: 0x2dd4bf, warm: 0xff7a3d };

    const HOLO_VERT = `
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vY;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vY = world.y;
        vec4 mv = viewMatrix * world;
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`;

    const HOLO_FRAG = `
      uniform vec3 uColor;
      uniform float uTime;
      uniform float uOpacity;
      uniform float uReveal;
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vY;
      void main() {
        if (vY > uReveal) discard;
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.0);
        float scan = 0.65 + 0.35 * sin(vY * 60.0 - uTime * 5.0);
        float front = smoothstep(uReveal - 0.15, uReveal, vY);
        float alpha = ((0.08 + fresnel * 0.9) * scan + front) * uOpacity;
        gl_FragColor = vec4(uColor * (0.7 + fresnel * 1.2 + front * 2.0), alpha);
      }`;

    const EDGE_VERT = `
      varying float vY;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vY = world.y;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`;

    const EDGE_FRAG = `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uReveal;
      varying float vY;
      void main() {
        if (vY > uReveal) discard;
        gl_FragColor = vec4(uColor * 1.5, 0.85 * uOpacity);
      }`;

    // Carrega o Three.js só quando o holograma aparece (o import map fica no <head>).
    let threePromise = null;
    function loadThree() {
      if (!threePromise) {
        threePromise = Promise.all([import("three"), import("three/addons/loaders/SVGLoader.js")])
          .then(([THREE, loaders]) => ({ THREE, SVGLoader: loaders.SVGLoader }));
        threePromise.catch(() => { threePromise = null; });
      }
      return threePromise;
    }

    // Busca o SVG do ícone no Bootstrap Icons e extruda em 3D.
    const iconGeometryCache = new Map();
    function loadIconGeometry(THREE, SVGLoader, icon) {
      if (!iconGeometryCache.has(icon)) {
        const url = `https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/${icon.replace(/^bi-/, "")}.svg`;
        const promise = fetch(url)
          .then((res) => { if (!res.ok) throw new Error(`${res.status} ${url}`); return res.text(); })
          .then((svg) => {
            // a cor do SVG não importa (o shader pinta), só evita o aviso do Three com "currentColor"
            const shapes = new SVGLoader().parse(svg.replace(/currentColor/g, "#fff")).paths.flatMap((path) => SVGLoader.createShapes(path));
            const surface = new THREE.ExtrudeGeometry(shapes, { depth: 2.2, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.1, bevelSegments: 2, curveSegments: 12 });
            surface.scale(1, -1, 1); // o SVG tem o eixo Y para baixo
            surface.center();
            surface.computeBoundingBox();
            const size = surface.boundingBox.getSize(new THREE.Vector3());
            const fit = 2.2 / Math.max(size.x, size.y);
            surface.scale(fit, fit, fit);
            return { surface, edges: new THREE.EdgesGeometry(surface, 25) };
          });
        iconGeometryCache.set(icon, promise);
        promise.catch(() => iconGeometryCache.delete(icon));
      }
      return iconGeometryCache.get(icon);
    }

    function startHologram({ THREE, SVGLoader }, mount, stage, onReady) {
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setClearColor(0x000000, 0);
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
      camera.position.set(0, 0.3, 6.4);
      camera.lookAt(0, -0.55, 0);
      const pivot = new THREE.Group();
      scene.add(pivot);

      // Partículas subindo pelo feixe do projetor.
      const count = 140;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const r = Math.sqrt(Math.random()) * 1.4;
        const a = Math.random() * Math.PI * 2;
        positions[i * 3] = Math.cos(a) * r;
        positions[i * 3 + 1] = -2 + Math.random() * 3.3;
        positions[i * 3 + 2] = Math.sin(a) * r;
        speeds[i] = 0.003 + Math.random() * 0.009;
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({ size: 0.035, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
      scene.add(new THREE.Points(particleGeo, particleMat));

      const reduced = prefersReducedMotion();
      const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
      const models = [];
      const t0 = performance.now();
      let last = t0, spin = 0.6, raf = 0, visible = true, disposed = false, pending = null;

      const frame = (now) => {
        const t = (now - t0) / 1000;
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        pointer.x += (pointer.tx - pointer.x) * 0.08;
        pointer.y += (pointer.ty - pointer.y) * 0.08;
        if (!reduced) spin += dt * 0.7;
        pivot.rotation.set(-0.12 + pointer.y * 0.35, spin + pointer.x * 0.9, 0);
        pivot.position.y = reduced ? 0 : Math.sin(t * 1.3) * 0.06;
        const flicker = reduced ? 1 : 0.9 + 0.1 * Math.sin(t * 47) * Math.sin(t * 3.3);

        for (let i = models.length - 1; i >= 0; i--) {
          const m = models[i];
          const born = Math.min((now - m.born) / 750, 1);
          const reveal = -1.4 + (1 - Math.pow(1 - born, 3)) * 2.8;
          let opacity = flicker;
          if (m.dying) {
            const d = (now - m.dying) / 280;
            if (d >= 1) {
              pivot.remove(m.group);
              m.materials.forEach((mat) => mat.dispose());
              models.splice(i, 1);
              continue;
            }
            opacity *= 1 - d;
          }
          m.materials.forEach((mat) => {
            mat.uniforms.uTime.value = t;
            mat.uniforms.uOpacity.value = opacity;
            mat.uniforms.uReveal.value = reveal;
          });
        }

        if (!reduced) {
          for (let i = 0; i < count; i++) {
            positions[i * 3 + 1] += speeds[i];
            if (positions[i * 3 + 1] > 1.3) positions[i * 3 + 1] = -2;
          }
          particleGeo.attributes.position.needsUpdate = true;
        }
        renderer.render(scene, camera);
      };

      const loop = (now) => {
        raf = 0;
        frame(now);
        if (visible && !disposed) raf = requestAnimationFrame(loop);
      };
      const kick = () => { if (!raf && visible && !disposed) raf = requestAnimationFrame(loop); };

      const resize = () => {
        const w = mount.clientWidth, h = mount.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        kick();
      };
      const ro = new ResizeObserver(resize);
      ro.observe(mount);
      resize();
      const io = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        if (visible) kick(); else { cancelAnimationFrame(raf); raf = 0; }
      });
      io.observe(mount);

      const onMove = (e) => {
        const r = stage.getBoundingClientRect();
        pointer.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
        pointer.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
        kick();
      };
      const onLeave = () => { pointer.tx = 0; pointer.ty = 0; };
      stage.addEventListener("pointermove", onMove);
      stage.addEventListener("pointerleave", onLeave);

      const show = (layer) => {
        const token = (pending = {});
        loadIconGeometry(THREE, SVGLoader, layer.icon).then(({ surface, edges }) => {
          if (pending !== token || disposed) return;
          models.forEach((m) => { if (!m.dying) m.dying = performance.now(); });
          const color = new THREE.Color(layer.mine ? HOLO_COLORS.warm : HOLO_COLORS.accent);
          const uniforms = () => ({ uColor: { value: color }, uTime: { value: 0 }, uOpacity: { value: 0 }, uReveal: { value: -2 } });
          const common = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };
          const surfaceMat = new THREE.ShaderMaterial({ ...common, side: THREE.DoubleSide, uniforms: uniforms(), vertexShader: HOLO_VERT, fragmentShader: HOLO_FRAG });
          const edgeMat = new THREE.ShaderMaterial({ ...common, uniforms: uniforms(), vertexShader: EDGE_VERT, fragmentShader: EDGE_FRAG });
          const group = new THREE.Group();
          group.add(new THREE.Mesh(surface, surfaceMat), new THREE.LineSegments(edges, edgeMat));
          pivot.add(group);
          models.push({ group, materials: [surfaceMat, edgeMat], born: performance.now(), dying: null });
          particleMat.color.copy(color);
          onReady();
          kick();
        }).catch(() => {});
      };

      const dispose = () => {
        disposed = true;
        cancelAnimationFrame(raf);
        ro.disconnect();
        io.disconnect();
        stage.removeEventListener("pointermove", onMove);
        stage.removeEventListener("pointerleave", onLeave);
        models.forEach((m) => m.materials.forEach((mat) => mat.dispose()));
        particleGeo.dispose();
        particleMat.dispose();
        renderer.dispose();
        renderer.domElement.remove();
      };

      return { show, dispose };
    }

    function HoloProjector({ layer, index, total }) {
      const stageRef = useRef(null);
      const mountRef = useRef(null);
      const engineRef = useRef(null);
      const layerRef = useRef(layer);
      const [ready, setReady] = useState(false);
      layerRef.current = layer;

      useEffect(() => {
        let cancelled = false;
        loadThree()
          .then((lib) => {
            if (cancelled) return;
            engineRef.current = startHologram(lib, mountRef.current, stageRef.current, () => { if (!cancelled) setReady(true); });
            engineRef.current.show(layerRef.current);
          })
          .catch(() => {}); // sem WebGL ou sem rede: fica o ícone plano com efeito de holograma
        return () => {
          cancelled = true;
          if (engineRef.current) engineRef.current.dispose();
          engineRef.current = null;
        };
      }, []);

      useEffect(() => {
        if (engineRef.current) engineRef.current.show(layer);
      }, [layer.icon, layer.mine]);

      const pad = (n) => String(n).padStart(2, "0");
      return (
        <div ref={stageRef} className={`holo-stage ${layer.mine ? "is-mine" : ""}`} role="img" aria-label={`Holograma 3D da camada ${layer.name}`}>
          <div className="holo-beam" />
          <div className="holo-base"><span /><span /><span /></div>
          {!ready && <i key={layer.icon} className={`bi ${layer.icon} holo-glyph`} aria-hidden="true" />}
          <div className="holo-canvas" ref={mountRef} />
          <div className="holo-scan" />
          <span className="holo-corner tl" /><span className="holo-corner tr" />
          <span className="holo-corner bl" /><span className="holo-corner br" />
          <div className="holo-hud">
            <div><small>CAMADA {pad(index + 1)}/{pad(total)}</small><strong>{layer.name}</strong></div>
            {layer.mine && <span className="mine-badge"><i className="bi bi-star-fill" /> minha atuação</span>}
          </div>
        </div>
      );
    }

    function LayerPanel({ title, tag, layers }) {
      const [active, setActive] = useState(layers.length - 1);
      const [picked, setPicked] = useState(null); // camada escolhida pela rolagem, para o destaque animado
      const panelRef = useRef(null);
      const activeRef = useRef(active);
      activeRef.current = active;
      const legend = layers.map((layer, i) => ({ layer, i })).reverse();
      const hasMine = layers.some((l) => l.mine);

      // No desktop o projetor fica fixo e "come" a lista ao rolar. Se a camada selecionada
      // some atrás dele, a primeira camada que ainda aparece abaixo assume o holograma.
      useEffect(() => {
        const panel = panelRef.current;
        let raf = 0;
        const check = () => {
          raf = 0;
          const stage = panel.querySelector(".holo-stage");
          if (!stage) return;
          const edge = stage.getBoundingClientRect().bottom;
          // "Sumiu" quando o nome da camada começa a entrar atrás do projetor.
          const hidden = (el) => { const r = el.getBoundingClientRect(); return r.height > 0 && r.top + 20 < edge; };
          const items = [...panel.querySelectorAll("[data-layer]")];
          const current = items.find((el) => Number(el.dataset.layer) === activeRef.current);
          if (!current || !hidden(current)) return;
          const next = items.find((el) => !hidden(el));
          if (!next) return;
          const i = Number(next.dataset.layer);
          setActive(i);
          setPicked(i);
        };
        const onScroll = () => { if (!raf) raf = requestAnimationFrame(check); };
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => {
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", onScroll);
          cancelAnimationFrame(raf);
        };
      }, []);

      const choose = (i) => { setActive(i); setPicked(null); };
      return (
        <div className="cardx stack-card" ref={panelRef}>
          <div className="dash-head">
            <span className="dash-title"><span className="live-dot" /> {title}</span>
            {tag && <span className="dash-tag">{tag}</span>}
          </div>
          <div className="holo-dock">
            <HoloProjector layer={layers[active]} index={active} total={layers.length} />
          </div>
          <ListGroup className="layer-legend">
            {legend.map(({ layer, i }) => (
              <ListGroup.Item
                key={layer.name}
                action
                active={active === i}
                className={[layer.mine && "is-mine", picked === i && "is-picked"].filter(Boolean).join(" ")}
                data-layer={i}
                onMouseEnter={() => choose(i)}
                onFocus={() => choose(i)}
                onClick={() => choose(i)}
                onAnimationEnd={(e) => { if (e.animationName === "layerPick") setPicked(null); }}
              >
                <span className={`layer-icon ${layer.mine ? "is-mine" : ""}`} aria-hidden="true"><i className={`bi ${layer.icon}`} /></span>
                <span className="layer-text">
                  <span className="layer-name">
                    <strong>{layer.name}</strong>
                    {layer.mine && <span className="mine-badge"><i className="bi bi-star-fill" /> minha atuação</span>}
                  </span>
                  <small>{layer.source}</small>
                  {layer.mine && layer.role && <span className="layer-role">{layer.role}</span>}
                </span>
              </ListGroup.Item>
            ))}
          </ListGroup>
          {hasMine && (
            <div className="mine-key"><i className="bi bi-star-fill" /> Camadas em que atuo diretamente. As demais fazem parte da plataforma.</div>
          )}
        </div>
      );
    }

    const formatCount = (v) => (v >= 1000 ? `${(v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} mil` : v.toLocaleString("pt-BR"));

    function RequestsDashboard({ data }) {
      const [ref, inView] = useInView({ threshold: 0.3 });
      const [hover, setHover] = useState(null);
      const { series } = data;
      const max = Math.max(...series.map((d) => d.value));
      const peak = series.findIndex((d) => d.value === max);
      const last = series.length - 1;
      const tipAlign = (i) => (i < 2 ? "start" : i > last - 2 ? "end" : "center");
      const shares = data.kpis.filter((k) => k.tone).map((k) => ({ ...k, pct: parseFloat(k.value) }));
      return (
        <div className="cardx dash-card" ref={ref}>
          <div className="dash-head">
            <span className="dash-title"><span className="live-dot" /> {data.heading}</span>
            <span className="dash-tag">{data.tag}</span>
          </div>
          <div className="dash-kpis">
            {data.kpis.map((k) => (
              <div className={`dash-kpi ${k.tone ? `tone-${k.tone}` : ""}`} key={k.label}>
                <i className={`bi ${k.icon}`} aria-hidden="true" />
                <strong>{k.value}</strong>
                <small>{k.label}</small>
              </div>
            ))}
          </div>
          <ProgressBar className="dash-progress" aria-label="Solicitações resolvidas e em aberto">
            {shares.map((s) => <ProgressBar key={s.label} variant={s.tone} now={inView ? s.pct : 0} />)}
          </ProgressBar>
          <div className="dash-progress-legend">
            {shares.map((s) => <span key={s.label}>{s.value} {s.label}</span>)}
          </div>
          <div className="dash-chart-title">{data.title}</div>
          <div className={`bars ${inView ? "is-in" : ""}`} aria-hidden="true" onMouseLeave={() => setHover(null)}>
            {series.map((d, i) => (
              <div
                key={d.year}
                className={`bar-col ${hover !== null && hover !== i ? "is-dim" : ""}`}
                style={{ "--h": `${Math.max((d.value / max) * 100, 1.5)}%`, "--d": `${i * 45}ms` }}
                onMouseEnter={() => setHover(i)}
              >
                <div className={`bar ${data.partialLast && i === last ? "is-partial" : ""}`} />
                {i === peak && hover === null && <span className="bar-label">{formatCount(d.value)}</span>}
                {hover === i && (
                  <div className={`bar-tip align-${tipAlign(i)}`}>
                    <strong>{formatCount(d.value)}</strong>
                    <span>{d.year}{data.partialLast && i === last ? " · parcial" : ""}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
          <div className="bar-years" aria-hidden="true">
            {series.map((d, i) => <span key={d.year}>{i % 2 === 0 ? `'${String(d.year).slice(2)}` : ""}</span>)}
          </div>
          <table className="visually-hidden">
            <caption>{data.title}</caption>
            <thead><tr><th>Ano</th><th>Solicitações</th></tr></thead>
            <tbody>{series.map((d) => <tr key={d.year}><td>{d.year}</td><td>{d.value}</td></tr>)}</tbody>
          </table>
          <div className="dash-foot"><i className="bi bi-info-circle me-1" />{data.source}</div>
        </div>
      );
    }

    /* ---------- Ilustrações das etapas do fluxo: SVG desenhado em código, acompanha o tema ---------- */

    // Bloco isométrico: (x, y) é o canto da frente no chão; w e d são os dois lados e h a altura.
    function IsoBox({ x, y, w, d, h, top = "f" }) {
      const F = [x, y], R = [x + w, y - w / 2], L = [x - d, y - d / 2], B = [x + w - d, y - w / 2 - d / 2];
      const up = ([px, py]) => [px, py - h];
      const pts = (list) => list.map((p) => p.join(",")).join(" ");
      return (
        <g>
          <polygon className="f side" points={pts([L, F, up(F), up(L)])} />
          <polygon className="f" points={pts([F, R, up(R), up(F)])} />
          <polygon className={top} points={pts([up(L), up(F), up(R), up(B)])} />
        </g>
      );
    }

    // Alfinete de mapa com a ponta em (x, y).
    function Pin({ x, y, c = "hot", drop = false }) {

    // Como os dados chegam ao mapa. No desktop o card fica fixo na tela e a rolagem acende uma etapa por vez,
    // com a ilustração grande ao lado; a rolagem continua livre, e "pular" leva ao fim. No celular, em telas
    // baixas ou com menos movimento, as etapas ficam abertas em sequência, cada uma com a sua ilustração.
    // fração de cada trecho em que a bike espera na parada antes de pedalar até a seguinte
    const STOP_WAIT = 0.35;
    const navOffset = () => (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 68) + 16;
    function FlowCard({ project }) {
      const steps = project.flow;
      const reduced = useMedia("(prefers-reduced-motion: reduce)");
      const pin = useMedia("(min-width: 1200px) and (min-height: 700px)") && !reduced;
      const [active, setActive] = useState(0);
      const wrapRef = useRef(null), spacerRef = useRef(null), routeRef = useRef(null), lastActive = useRef(0);
      const snapRef = useRef({ on: false, timer: 0 });

      // Posiciona a pista, as paradas e a bike a partir das etapas. Em cada etapa a bike espera na parada e,
      // na reta final antes da etapa seguinte acender, pedala até a próxima parada. Quando encosta nela, é puxada
      // para o centro da parada e fica presa ali, e a etapa seguinte acende. Devolve a etapa ativa.
      const placeRoute = (t) => {
        const route = routeRef.current;
        if (!route) return Math.min(steps.length - 1, Math.floor(t));
        const base = route.getBoundingClientRect().left;
        const c = [...route.parentNode.querySelectorAll(".flow-step")].map((b) => { const r = b.getBoundingClientRect(); return r.left + r.width / 2 - base; });
        const n = c.length, i = Math.min(n - 1, Math.floor(t));
        const u = i >= n - 1 ? 0 : Math.min(1, Math.max(0, (t - i - STOP_WAIT) / (1 - STOP_WAIT)));
        const ease = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        const raw = i >= n - 1 ? c[n - 1] : c[i] + (c[i + 1] - c[i]) * ease;
        // encostou: a borda da bike tocou a parada seguinte
        const bike = route.querySelector(".flow-bike"), stops = route.querySelectorAll(".flow-stop");
        const touch = i < n - 1 ? (bike.offsetWidth + stops[i + 1].offsetWidth) / 2 : 0;
        const snapped = i < n - 1 && c[i + 1] - raw <= touch;
        const x = snapped ? c[i + 1] : raw;
        // ao prender ou soltar, a bike desliza com mola até o lugar; no resto do tempo segue a rolagem direto
        const st = snapRef.current;
        if (snapped !== st.on) {
          st.on = snapped;
          route.classList.add("is-snapping");
          clearTimeout(st.timer);
          st.timer = setTimeout(() => route.classList.remove("is-snapping"), 420);
        }
        route.style.setProperty("--road-l", `${c[0]}px`);
        route.style.setProperty("--road-w", `${c[n - 1] - c[0]}px`);
        route.style.setProperty("--road-fill", `${x - c[0]}px`);
        route.style.setProperty("--bike-x", `${x}px`);
        route.classList.toggle("is-parked", u === 0 || u === 1 || snapped);
        stops.forEach((s, k) => { s.style.left = `${c[k]}px`; s.classList.toggle("is-reached", x >= c[k] - 1); });
        return snapped ? i + 1 : i;
      };

      useEffect(() => {
        if (!pin) return;
        const progress = () => {
          const w = wrapRef.current;
          if (!w || !w.offsetParent) return null; // aba escondida
          return Math.min(1, Math.max(0, (navOffset() - w.getBoundingClientRect().top) / spacerRef.current.offsetHeight));
        };
        const update = () => {
          const p = progress();
          if (p !== null) setActive(placeRoute(p * steps.length));
        };
        // Quando a rolagem para com a bike entre duas paradas, ela é levada até a parada mais próxima:
        // a seguinte se já passou da metade da pista entre as duas, a anterior se não passou.
        let idle = 0;
        const settle = () => {
          const p = progress();
          if (p === null || p <= 0 || p >= 1) return;
          const t = p * steps.length, i = Math.floor(t), f = t - i;
          if (i >= steps.length - 1 || f < STOP_WAIT) return;
          const u = (f - STOP_WAIT) / (1 - STOP_WAIT);
          scrollToStep(u >= 0.5 ? i + 1 : i);
        };
        const onScroll = () => { update(); clearTimeout(idle); idle = setTimeout(settle, 220); };
        update();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", update);
        return () => { clearTimeout(idle); window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", update); };
      }, [pin, steps.length]);

      // ao chegar numa etapa nova, um anel se abre a partir dela
      useEffect(() => {
        if (!pin || prefersReducedMotion()) return;
        const forward = active > lastActive.current;
        lastActive.current = active;
        if (!forward) return;
        const ring = wrapRef.current && wrapRef.current.querySelectorAll(".flow-burst")[active];
        if (!ring) return;
        loadXpLib("anime").then(() => {
          anime.remove(ring);
          anime({ targets: ring, scale: [1, 1.14], opacity: [0.9, 0], duration: 750, easing: "easeOutExpo" });
        }).catch(() => {});
      }, [active, pin]);

      // leva a rolagem até o trecho da etapa i, ou (i = steps.length) até depois do card
      const scrollToStep = (i) => {
        const w = wrapRef.current;
        const top = w.getBoundingClientRect().top + window.scrollY - navOffset();
        // cada etapa para no meio do trecho em que a bike fica parada na sua parada
        const y = i >= steps.length ? top + w.offsetHeight : top + ((i + STOP_WAIT / 2) * spacerRef.current.offsetHeight) / steps.length;
        window.scrollTo({ top: y, behavior: reduced ? "auto" : "smooth" });
      };

      const head = (
        <div className="flow-head">
          <div className="flow-title"><i className="bi bi-signpost-split me-2" />Como os dados chegam ao mapa</div>
          {pin && <span className="flow-hint"><i className="bi bi-mouse" /> role para passar pelas etapas</span>}
        </div>
      );

      if (!pin) {
        return (
          <div className="cardx flow-card">
            {head}
            <ol className="flow-open">
              {steps.map((step, i) => {
                const Art = FLOW_ART[step.art];
                return (
                  <li className="flow-open-step" key={step.label}>
                    <div className="flow-open-head"><span className="idx">{pad2(i + 1)}{step.icon && <i className={`bi ${step.icon}`} aria-hidden="true" />}</span>{step.label}</div>
                    {Art && <div className="flow-art"><Art project={project} /></div>}
                    {step.note && <p>{step.note}</p>}
                  </li>
                );
              })}
            </ol>
          </div>
        );
      }

      const current = steps[active];
      const Art = FLOW_ART[current.art];
      return (
        <div className="flow-pin" ref={wrapRef} style={{ "--flow-n": steps.length }}>
          <div className="cardx flow-card">
            {head}
            <div className="flow">
              {steps.map((step, i) => (
                <React.Fragment key={step.label}>
                  <button type="button" className={`flow-step ${i === active ? "is-on" : ""}`} aria-current={i === active ? "step" : undefined} onClick={() => scrollToStep(i)}>
                    <span className="idx">{pad2(i + 1)}<i className={`bi ${i < active ? "bi-check2" : step.icon}`} aria-hidden="true" /></span>
                    <span className="lbl">{step.label}</span>
                    <span className="flow-burst" aria-hidden="true" />
                  </button>
                </React.Fragment>
              ))}
            </div>
            <div className="flow-route" ref={routeRef} aria-hidden="true">
              <div className="flow-road"><span className="flow-road-fill" /></div>
              {steps.map((step, i) => (
                <span key={step.label} className={`flow-stop ${i === steps.length - 1 ? "end" : ""}`}>{i === steps.length - 1 && <i className="bi bi-geo-alt-fill" />}</span>
              ))}
              <span className="flow-bike"><i className="bi bi-bicycle" /></span>
            </div>
            <div className="flow-stage">
              <div className="flow-art fade-swap" key={active}>{Art && <Art project={project} />}</div>
              <div className="flow-stage-text" aria-live="polite">
                <small>etapa {pad2(active + 1)} / {pad2(steps.length)}</small>
                <h4>{current.label}</h4>
                {current.note && <p>{current.note}</p>}
                <button type="button" className="flow-skip" onClick={() => scrollToStep(steps.length)}>pular o fluxo <i className="bi bi-arrow-down" /></button>
              </div>
            </div>
          </div>
          <div className="flow-spacer" ref={spacerRef} aria-hidden="true" />
        </div>
      );
    }

    /* ---------- Experiência na Prefeitura: um artefato diferente para cada frente de trabalho ---------- */

    // Bibliotecas dos artefatos, carregadas só quando eles aparecem na tela.
    const XP_LIBS = {
      anime: "https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js",
      gitgraph: "https://cdn.jsdelivr.net/npm/@gitgraph/js@1.4.0/lib/gitgraph.umd.js",
      chart: "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js",
      scrollama: "https://cdn.jsdelivr.net/npm/scrollama@3.2.0/build/scrollama.min.js",
      gsap: "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js",
      scramble: "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrambleTextPlugin.min.js",
    };
    const xpLibCache = {};
    const loadXpLib = (name) => xpLibCache[name] || (xpLibCache[name] = new Promise((resolve, reject) => {
      const tag = document.createElement("script");
      tag.src = XP_LIBS[name];
      tag.async = true;
      tag.crossOrigin = "anonymous";
      tag.onload = () => resolve();
      tag.onerror = reject;
      document.head.appendChild(tag);
    }));
    const themeColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();

    // Liga o artefato quando ele aparece (carrega as bibliotecas e chama setup) e pausa o loop quando ele sai da tela.
    // setup devolve { play, pause, destroy } ou null para um artefato parado.
    function useLive(libs, setup) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        let ctl = null, dead = false, visible = false, starting = false;
        const start = () => {
          starting = true;
          Promise.all(libs.map(loadXpLib))
            .then(() => {
              if (dead) return;
              ctl = setup(el) || {};
              if (!visible && ctl.pause) ctl.pause();
            })
            .catch(() => el.classList.add("is-static")); // sem rede para a biblioteca: mostra o estado final
        };
        const io = new IntersectionObserver(([e]) => {
          visible = e.isIntersecting;
          if (visible && !starting) start();
          else if (ctl) (visible ? ctl.play : ctl.pause)?.();
        }, { threshold: 0.2 });
        io.observe(el);
        return () => { dead = true; io.disconnect(); if (ctl && ctl.destroy) ctl.destroy(); };
      }, []);
      return ref;
    }

    // 1. Agentes e MCP: um agente recebe um pedido e chama ferramentas, linha a linha (anime.js).

          .add({ targets: lines, opacity: 0, duration: 350, easing: "easeInQuad" }, "+=2400");
        return { play: () => tl.play(), pause: () => tl.pause(), destroy: () => tl.pause() };
      });

    // 2. APIs: um log de requisições que não para de chegar.
    const API_CALLS = [
      ["GET", "/chamados?recentes", 200, 182],
      ["POST", "/webhook/aprovacao", 201, 96],
      ["GET", "/estacoes/status", 200, 140],
      ["PATCH", "/workspaces/acesso", 204, 230],

      ["POST", "/notificacoes", 202, 74],
    ];
    function ApiArt() {
      const [rows, setRows] = useState(() => API_CALLS.slice(0, 4).map((c, i) => ({ id: i, c })));
      const ref = useLive([], () => {
        if (prefersReducedMotion()) return null;
        let n = 4, timer = null;
        const tick = () => { const id = n++; setRows((r) => [...r.slice(1), { id, c: API_CALLS[id % API_CALLS.length] }]); };
        const play = () => { if (!timer) timer = setInterval(tick, 1400); };
        const pause = () => { clearInterval(timer); timer = null; };
        play();
        return { play, pause, destroy: pause };
      });
      return (
        <div className="art art-api" ref={ref} aria-hidden="true">
          {rows.map(({ id, c: [method, path, status, ms] }) => (

    // 3. n8n: o pedido percorre o fluxo e acende cada nó (anime.js).
    const N8N_NODES = [

      { icon: "bi-envelope-check", label: "Aprovação" },

    function N8nArt() {

        if (prefersReducedMotion()) { nodes.forEach((nd) => nd.classList.add("on")); return null; }
        const centers = () => nodes.map((nd) => nd.offsetLeft + nd.offsetWidth / 2);
        const state = { x: 0 };
        const anim = anime({
          targets: state, x: [0, 1], duration: 3400, endDelay: 1100, easing: "easeInOutSine", loop: true,
          update: () => {
            const c = centers();
            const x = c[0] + (c[c.length - 1] - c[0]) * state.x;
            pulse.style.transform = `translateX(${x}px)`;
            nodes.forEach((nd, i) => nd.classList.toggle("on", x >= c[i] - 6));
          },
        });
        return { play: () => anim.play(), pause: () => anim.pause(), destroy: () => anim.pause() };
      });
      return (
        <div className="art art-n8n" ref={ref} aria-hidden="true">
          <div className="n8n-tags"><span>n8n</span><span>Azure</span><span>Microsoft Fabric</span></div>

    // 4. Foundry: pergunta em linguagem natural, a consulta ao modelo semântico e a resposta (anime.js).

    // 8. Git: os commits entram um a um em desenvolvimento e sobem para produção com merge (gitgraph.js).
    function GitArt() {
      const ref = useLive(["gitgraph"], (el) => {
        const box = el.querySelector(".gg");
        let timers = [];
        const clear = () => { timers.forEach(clearTimeout); timers = []; };
        const run = (animate) => {
          clear();
          box.innerHTML = "";
          const template = GitgraphJS.templateExtend(GitgraphJS.TemplateName.Metro, {
            colors: [themeColor("accent"), themeColor("blue"), themeColor("good")],
            branch: { lineWidth: 4, spacing: 30, label: { display: false } },
            commit: { spacing: 40, dot: { size: 7, strokeWidth: 2, strokeColor: themeColor("line") }, message: { display: false } },
          });
          const gg = GitgraphJS.createGitgraph(box, { template, orientation: GitgraphJS.Orientation.Horizontal, author: "Kluivert" });
          let prod, dev;
          const steps = [
            () => { prod = gg.branch("produção"); prod.commit("estável"); },
            () => { dev = gg.branch("desenvolvimento"); dev.commit("feature"); },
            () => dev.commit("testes"),
            () => prod.merge(dev, "deploy"),
            () => dev.commit("ajuste"),
            () => dev.commit("revisão"),
            () => prod.merge(dev, "deploy"),
          ];
          if (!animate) { steps.forEach((f) => f()); return; }
          steps.forEach((f, i) => timers.push(setTimeout(f, 250 + i * 700)));
          timers.push(setTimeout(() => run(true), 250 + steps.length * 700 + 2600)); // recomeça
        };
        const still = prefersReducedMotion();
        run(!still);
        const mo = new MutationObserver(() => run(!still));
        mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-bs-theme"] });
        return still
          ? { destroy: () => mo.disconnect() }
          : { play: () => run(true), pause: clear, destroy: () => { clear(); mo.disconnect(); } };
      });
      return (
        <div className="art art-git" ref={ref} aria-hidden="true">
          <div className="gg-legend"><span className="b-prod">produção</span><span className="b-dev">desenvolvimento</span></div>
          <div className="gg" />
        </div>
      );
    }
