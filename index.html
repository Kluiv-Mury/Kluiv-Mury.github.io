  <style>
    /* ================= Tokens de tema ================= */

      --km-accent-2-rgb: 37, 99, 235;

      --km-good: #059669;

    /* ================= Base ================= */
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {

    /* ================= Preloader ================= */

      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));

    /* ================= Navbar ================= */

    .icon-btn {

    }

    /* ================= Botões e chips ================= */
    .btn-km, .btn-ghost { display: inline-flex; align-items: center; gap: .55rem; border-radius: 999px; padding: .8rem 1.4rem; font-weight: 600; transition: transform .2s, box-shadow .2s, border-color .2s, background-color .2s; }
    .btn-km {
      border: 0; color: #04131a !important;

    }
    .btn-km:hover, .btn-km:focus-visible { transform: translateY(-2px); box-shadow: 0 18px 40px -14px rgba(var(--km-accent-rgb), .9); }
    .btn-ghost { border: 1px solid var(--km-border); background: var(--km-surface); color: var(--km-text) !important; }
    .btn-ghost:hover, .btn-ghost:focus-visible { transform: translateY(-2px); border-color: rgba(var(--km-accent-rgb), .6); background: rgba(var(--km-accent-rgb), .08); }
    .chip {

    .chip-row { display: flex; flex-wrap: wrap; gap: .45rem; }

    /* ================= Estrutura de seção ================= */
    .section { position: relative; padding: 112px 0; }
    @media (max-width: 767.98px) { .section { padding: 80px 0; } }
    .section-header { max-width: 720px; margin-bottom: 3.2rem; }
    .section-header.text-center { margin-left: auto; margin-right: auto; }

    .kicker::before { content: ""; width: 28px; height: 2px; border-radius: 2px; background: currentColor; }
    .section-header.text-center .kicker::after { content: ""; width: 28px; height: 2px; border-radius: 2px; background: currentColor; }
    .section-title { font-size: clamp(2rem, 4.2vw, 3rem); font-weight: 700; margin: .9rem 0 1rem; }
    .section-lead { color: var(--km-muted); font-size: 1.08rem; line-height: 1.7; margin: 0; }
    .glass {
      background: var(--km-surface);
      border: 1px solid var(--km-border);
      border-radius: 22px;
      -webkit-backdrop-filter: blur(12px);
              backdrop-filter: blur(12px);
    }

    /* ================= Animações de entrada ================= */

    .reveal.is-visible { opacity: 1; transform: none; }

    /* ================= Hero ================= */
    .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 130px 0 90px; overflow: hidden; }
    .hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .6; }
    .hero-glow {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(620px circle at var(--gx, 72%) var(--gy, 32%), rgba(var(--km-accent-rgb), .15), transparent 60%),
        radial-gradient(800px circle at 8% 92%, rgba(var(--km-accent-2-rgb), .12), transparent 60%);
    }
    .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(transparent, var(--km-bg)); pointer-events: none; }
    .hero > .container { position: relative; z-index: 2; }
    .eyebrow {

      padding: .45rem .95rem; border-radius: 999px;
      border: 1px solid var(--km-border); background: var(--km-surface);
      color: var(--km-muted); font-size: .86rem;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--km-accent); flex: none; }
    .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--km-accent); animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
    .display-name { font-size: clamp(2.8rem, 7.2vw, 5.4rem); font-weight: 700; line-height: .98; margin: 1.5rem 0 1.1rem; }
    .display-name small { display: block; font-size: .32em; font-weight: 500; letter-spacing: 0; color: var(--km-muted); margin-bottom: .7rem; font-family: "Inter", sans-serif; }
    .typing { font: 500 clamp(1rem, 2.3vw, 1.32rem) "JetBrains Mono", monospace; color: var(--km-accent); min-height: 1.9em; margin-bottom: 1.1rem; }
    .typing .prompt { color: var(--km-muted); margin-right: .55rem; }

    .hero-lead { color: var(--km-muted); font-size: 1.1rem; line-height: 1.75; max-width: 600px; margin-bottom: 2rem; }
    .socials { display: flex; gap: .6rem; margin-top: 2.2rem; }
    .scroll-cue {
      position: absolute; left: 50%; bottom: -54px; transform: translateX(-50%);

    .scroll-cue span { width: 4px; height: 8px; border-radius: 2px; background: var(--km-accent); animation: scrollCue 1.8s ease-in-out infinite; }
    @media (max-width: 991.98px) { .scroll-cue { display: none; } }

    /* Cartão de código */
    .code-wrap { position: relative; padding: 18px 8px; }
    .code-card {
      position: relative; overflow: hidden; border-radius: 20px;
      background: rgba(11, 17, 32, .92); color: #d6deeb;
      border: 1px solid rgba(148, 163, 184, .18);
      box-shadow: 0 40px 90px -30px var(--km-shadow), 0 0 0 1px rgba(var(--km-accent-rgb), .06), 0 0 80px -30px rgba(var(--km-accent-rgb), .45);

    .code-card:hover { transform: perspective(1300px) rotateY(0) rotateX(0); }
    .code-head { display: flex; align-items: center; gap: .5rem; padding: .85rem 1.1rem; border-bottom: 1px solid rgba(148, 163, 184, .14); font: 500 .78rem "JetBrains Mono", monospace; color: #8b9bb4; }
    .code-head .file { margin-left: .6rem; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
    .code-body { padding: 1.2rem 1.2rem 1.4rem; font: .85rem/1.85 "JetBrains Mono", monospace; overflow-x: auto; white-space: pre; }
    .code-line { opacity: 0; animation: lineIn .5s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--l) * 120ms + 500ms); }
    .code-line .ln { display: inline-block; width: 2ch; margin-right: 1.1rem; text-align: right; color: #4b5b75; user-select: none; }

    @media (max-width: 575.98px) {

    /* ================= Sobre + números ================= */
    .about-text p { color: var(--km-muted); font-size: 1.06rem; line-height: 1.8; }
    .about-text strong { color: var(--km-text); font-weight: 600; }
    .fact { display: flex; gap: 1rem; align-items: flex-start; padding: 1.05rem 1.2rem; }
    .fact + .fact { border-top: 1px solid var(--km-border); }

    /* ================= Niterói em camadas ================= */
    .city-section { background: linear-gradient(180deg, transparent, rgba(var(--km-accent-rgb), .045) 30%, rgba(var(--km-accent-2-rgb), .045) 70%, transparent); }
    .city-tabs.nav {

    .city-tabs .nav-link {

    .city-tabs .nav-link:hover { color: var(--km-text); }
    .city-tabs .nav-link.active {
      color: #04131a !important;

    .stack-card, .dash-card { padding: 1.4rem; }

    .dash-title { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; font-size: .95rem; }
    .dash-tag { flex: none; padding: .2rem .6rem; border-radius: 999px; border: 1px solid var(--km-border); font: 500 .72rem "JetBrains Mono", monospace; color: var(--km-muted); }

    .live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--km-good); animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
    /* Projetor de holograma: o palco fica escuro nos dois temas, como o cartão de código. */
    .holo-stage {
      --holo-rgb: 45, 212, 191;
      position: relative; isolation: isolate; overflow: hidden;
      height: 330px; margin-bottom: .6rem; border-radius: 18px;
      border: 1px solid rgba(var(--holo-rgb), .28);
      background:
        radial-gradient(ellipse 60% 45% at 50% 85%, rgba(var(--holo-rgb), .16), transparent 70%),
        radial-gradient(ellipse at 50% 0%, #0d1830, #050912 70%);
      transition: border-color .4s;
    }

    .holo-canvas { position: absolute; inset: 0; z-index: 2; }

    .holo-corner.tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }

    .holo-hud { position: absolute; z-index: 4; top: 18px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; pointer-events: none; }

    @keyframes holoSweep { to { transform: translateY(480px); } }
    @keyframes holoFloat { 50% { transform: translate(-50%, calc(-50% - 8px)); } }
    @keyframes beamPulse { 50% { opacity: .65; } }
    .layer-legend { margin-top: .4rem; gap: .35rem; }

    .dash-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 1.4rem; }

    .tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out, border-color .3s; will-change: transform; }

    /* ================= Keyframes ================= */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes lineIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    @keyframes flowY { to { background-position: 0 10px; } }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .reveal { opacity: 1; transform: none; }
      .code-card, .tilt { transform: none !important; }
      /* A faixa de tecnologias continua rolando mesmo com animações reduzidas no sistema. */
      .marquee-track { animation-duration: 42s !important; animation-iteration-count: infinite !important; }

    const prefersReducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function useInView({ threshold = 0.15, once = true } = {}) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (!("IntersectionObserver" in window)) { setInView(true); return; }
        const io = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setInView(true);
            if (once) io.disconnect();
          } else if (!once) {
            setInView(false);
          }
        }, { threshold });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, inView];
    }

    function Reveal({ children, delay = 0, className = "", ...rest }) {
      const [ref, inView] = useInView();
      return (
        <div ref={ref} className={`reveal ${inView ? "is-visible" : ""} ${className}`} style={delay ? { transitionDelay: `${delay}ms` } : undefined} {...rest}>
          {children}
        </div>
      );
    }

    function useTyping(words, { typeSpeed = 65, deleteSpeed = 32, pause = 1700 } = {}) {
      const [text, setText] = useState("");
      const [index, setIndex] = useState(0);
      const [deleting, setDeleting] = useState(false);
      useEffect(() => {
        if (prefersReducedMotion()) { setText(words[0]); return; }
        const word = words[index % words.length];
        let timer;
        if (!deleting && text === word) {
          timer = setTimeout(() => setDeleting(true), pause);
        } else if (deleting && text === "") {
          setDeleting(false);
          setIndex((i) => i + 1);
        } else {
          const next = deleting ? word.slice(0, text.length - 1) : word.slice(0, text.length + 1);
          timer = setTimeout(() => setText(next), deleting ? deleteSpeed : typeSpeed);
        }
        return () => clearTimeout(timer);
      }, [text, deleting, index]);
      return text;
    }

    function useScrollSpy(ids) {
      const [active, setActive] = useState("");
      useEffect(() => {
        const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
        }, { rootMargin: "-45% 0px -50% 0px" });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
      return active;
    }

    function useTheme() {
      const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-bs-theme") || "dark");
      useEffect(() => {
        document.documentElement.setAttribute("data-bs-theme", theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#070b14" : "#f5f7fb");
      }, [theme]);
      const toggle = () => setTheme((t) => {
        const next = t === "dark" ? "light" : "dark";
        try { localStorage.setItem("km-theme", next); } catch (e) {}
        return next;
      });
      return [theme, toggle];
    }

    function CountUp({ end, duration = 1500 }) {
      const [ref, inView] = useInView({ threshold: 0.5 });
      const [value, setValue] = useState(0);
      useEffect(() => {
        if (!inView) return;
        if (prefersReducedMotion()) { setValue(end); return; }
        let raf, start;
        const step = (ts) => {
          if (!start) start = ts;
          const p = Math.min((ts - start) / duration, 1);
          setValue(Math.round(end * (1 - Math.pow(1 - p, 3))));
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [inView, end]);
      return <span ref={ref}>{value}</span>;
    }

    // Rede de pontos animada no fundo do topo: dados se conectando.
    function DataNetwork({ theme }) {
      const canvasRef = useRef(null);
      const rgbRef = useRef("45, 212, 191");
      const redrawRef = useRef(() => {});

      useEffect(() => {
        rgbRef.current = getComputedStyle(document.documentElement).getPropertyValue("--km-accent-rgb").trim() || "45, 212, 191";
        redrawRef.current();
      }, [theme]);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const reduced = prefersReducedMotion();
        const mouse = { x: -9999, y: -9999 };
        let w = 0, h = 0, nodes = [], raf = 0, visible = true;

        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth; h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.round(Math.min(110, Math.max(36, (w * h) / 15000)));
          nodes = Array.from({ length: count }, () => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
            r: Math.random() * 1.6 + 0.7,
          }));
        };

        const frame = () => {
          const rgb = rgbRef.current;
          ctx.clearRect(0, 0, w, h);
          const maxD = 130;
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            if (!reduced) {
              a.x += a.vx; a.y += a.vy;
              if (a.x < 0 || a.x > w) a.vx *= -1;
              if (a.y < 0 || a.y > h) a.vy *= -1;
            }
            for (let j = i + 1; j < nodes.length; j++) {
              const b = nodes[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < maxD * maxD) {
                ctx.strokeStyle = `rgba(${rgb}, ${(1 - Math.sqrt(d2) / maxD) * 0.32})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
              }
            }
            const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
            if (md < 170) {
              ctx.strokeStyle = `rgba(${rgb}, ${(1 - md / 170) * 0.6})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
            }
          }
          ctx.fillStyle = `rgba(${rgb}, 0.9)`;
          for (const n of nodes) { ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill(); }
        };

        const loop = () => { frame(); if (visible && !reduced) raf = requestAnimationFrame(loop); };
        const start = () => { cancelAnimationFrame(raf); loop(); };
        redrawRef.current = () => { if (reduced || !visible) frame(); };

        const onMove = (e) => {
          const r = canvas.getBoundingClientRect();
          mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
          if (reduced) frame();
        };
        const onLeave = () => { mouse.x = -9999; mouse.y = -9999; };
        const onResize = () => { resize(); if (reduced) frame(); };

        resize();
        start();
        window.addEventListener("resize", onResize);
        window.addEventListener("pointermove", onMove, { passive: true });
        document.addEventListener("pointerleave", onLeave);
        const io = new IntersectionObserver(([entry]) => {
          visible = entry.isIntersecting;
          if (visible) start(); else cancelAnimationFrame(raf);
        });
        io.observe(canvas);

        return () => {
          cancelAnimationFrame(raf);
          io.disconnect();
          window.removeEventListener("resize", onResize);
          window.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerleave", onLeave);
        };
      }, []);

      return <canvas ref={canvasRef} className="hero-canvas" aria-hidden="true" />;
    }

        el.style.setProperty("--rx", "0deg");

    /* ---------- Holograma 3D das camadas (Three.js) ---------- */

    const HOLO_COLORS = { accent: 0x2dd4bf, warm: 0xfbbf24 };

    const HOLO_VERT = `
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vY;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vY = world.y;
        vec4 mv = viewMatrix * world;
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`;

    const HOLO_FRAG = `
      uniform vec3 uColor;
      uniform float uTime;
      uniform float uOpacity;
      uniform float uReveal;
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vY;
      void main() {
        if (vY > uReveal) discard;
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.0);
        float scan = 0.65 + 0.35 * sin(vY * 60.0 - uTime * 5.0);
        float front = smoothstep(uReveal - 0.15, uReveal, vY);
        float alpha = ((0.08 + fresnel * 0.9) * scan + front) * uOpacity;
        gl_FragColor = vec4(uColor * (0.7 + fresnel * 1.2 + front * 2.0), alpha);
      }`;

    const EDGE_VERT = `
      varying float vY;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vY = world.y;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`;

    const EDGE_FRAG = `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uReveal;
      varying float vY;
      void main() {
        if (vY > uReveal) discard;
        gl_FragColor = vec4(uColor * 1.5, 0.85 * uOpacity);
      }`;

    // Carrega o Three.js só quando o holograma aparece (o import map fica no <head>).
    let threePromise = null;
    function loadThree() {
      if (!threePromise) {
        threePromise = Promise.all([import("three"), import("three/addons/loaders/SVGLoader.js")])
          .then(([THREE, loaders]) => ({ THREE, SVGLoader: loaders.SVGLoader }));
        threePromise.catch(() => { threePromise = null; });
      }
      return threePromise;
    }

    // Busca o SVG do ícone no Bootstrap Icons e extruda em 3D.
    const iconGeometryCache = new Map();
    function loadIconGeometry(THREE, SVGLoader, icon) {
      if (!iconGeometryCache.has(icon)) {
        const url = `https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/${icon.replace(/^bi-/, "")}.svg`;
        const promise = fetch(url)
          .then((res) => { if (!res.ok) throw new Error(`${res.status} ${url}`); return res.text(); })
          .then((svg) => {
            // a cor do SVG não importa (o shader pinta), só evita o aviso do Three com "currentColor"
            const shapes = new SVGLoader().parse(svg.replace(/currentColor/g, "#fff")).paths.flatMap((path) => SVGLoader.createShapes(path));
            const surface = new THREE.ExtrudeGeometry(shapes, { depth: 2.2, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.1, bevelSegments: 2, curveSegments: 12 });
            surface.scale(1, -1, 1); // o SVG tem o eixo Y para baixo
            surface.center();
            surface.computeBoundingBox();
            const size = surface.boundingBox.getSize(new THREE.Vector3());
            const fit = 2.2 / Math.max(size.x, size.y);
            surface.scale(fit, fit, fit);
            return { surface, edges: new THREE.EdgesGeometry(surface, 25) };
          });
        iconGeometryCache.set(icon, promise);
        promise.catch(() => iconGeometryCache.delete(icon));
      }
      return iconGeometryCache.get(icon);
    }

    function startHologram({ THREE, SVGLoader }, mount, stage, onReady) {
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
      camera.position.set(0, 0.3, 6.4);
      camera.lookAt(0, -0.55, 0);
      const pivot = new THREE.Group();
      scene.add(pivot);

      // Partículas subindo pelo feixe do projetor.
      const count = 140;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const r = Math.sqrt(Math.random()) * 1.4;
        const a = Math.random() * Math.PI * 2;
        positions[i * 3] = Math.cos(a) * r;
        positions[i * 3 + 1] = -2 + Math.random() * 3.3;
        positions[i * 3 + 2] = Math.sin(a) * r;
        speeds[i] = 0.003 + Math.random() * 0.009;
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({ size: 0.035, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
      scene.add(new THREE.Points(particleGeo, particleMat));

      const reduced = prefersReducedMotion();
      const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
      const models = [];
      const t0 = performance.now();
      let last = t0, spin = 0.6, raf = 0, visible = true, disposed = false, pending = null;

      const frame = (now) => {
        const t = (now - t0) / 1000;
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        pointer.x += (pointer.tx - pointer.x) * 0.08;
        pointer.y += (pointer.ty - pointer.y) * 0.08;
        if (!reduced) spin += dt * 0.7;
        pivot.rotation.set(-0.12 + pointer.y * 0.35, spin + pointer.x * 0.9, 0);
        pivot.position.y = reduced ? 0 : Math.sin(t * 1.3) * 0.06;
        const flicker = reduced ? 1 : 0.9 + 0.1 * Math.sin(t * 47) * Math.sin(t * 3.3);

        for (let i = models.length - 1; i >= 0; i--) {
          const m = models[i];
          const born = Math.min((now - m.born) / 750, 1);
          const reveal = -1.4 + (1 - Math.pow(1 - born, 3)) * 2.8;
          let opacity = flicker;
          if (m.dying) {
            const d = (now - m.dying) / 280;
            if (d >= 1) {
              pivot.remove(m.group);
              m.materials.forEach((mat) => mat.dispose());
              models.splice(i, 1);
              continue;
            }
            opacity *= 1 - d;
          }
          m.materials.forEach((mat) => {
            mat.uniforms.uTime.value = t;
            mat.uniforms.uOpacity.value = opacity;
            mat.uniforms.uReveal.value = reveal;
          });
        }

        if (!reduced) {
          for (let i = 0; i < count; i++) {
            positions[i * 3 + 1] += speeds[i];
            if (positions[i * 3 + 1] > 1.3) positions[i * 3 + 1] = -2;
          }
          particleGeo.attributes.position.needsUpdate = true;
        }
        renderer.render(scene, camera);
      };

      const loop = (now) => {
        raf = 0;
        frame(now);
        if (visible && !disposed) raf = requestAnimationFrame(loop);
      };
      const kick = () => { if (!raf && visible && !disposed) raf = requestAnimationFrame(loop); };

      const resize = () => {
        const w = mount.clientWidth, h = mount.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        kick();
      };
      const ro = new ResizeObserver(resize);
      ro.observe(mount);
      resize();
      const io = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        if (visible) kick(); else { cancelAnimationFrame(raf); raf = 0; }
      });
      io.observe(mount);

      const onMove = (e) => {
        const r = stage.getBoundingClientRect();
        pointer.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
        pointer.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
        kick();
      };
      const onLeave = () => { pointer.tx = 0; pointer.ty = 0; };
      stage.addEventListener("pointermove", onMove);
      stage.addEventListener("pointerleave", onLeave);

      const show = (layer) => {
        const token = (pending = {});
        loadIconGeometry(THREE, SVGLoader, layer.icon).then(({ surface, edges }) => {
          if (pending !== token || disposed) return;
          models.forEach((m) => { if (!m.dying) m.dying = performance.now(); });
          const color = new THREE.Color(layer.mine ? HOLO_COLORS.warm : HOLO_COLORS.accent);
          const uniforms = () => ({ uColor: { value: color }, uTime: { value: 0 }, uOpacity: { value: 0 }, uReveal: { value: -2 } });
          const common = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };
          const surfaceMat = new THREE.ShaderMaterial({ ...common, side: THREE.DoubleSide, uniforms: uniforms(), vertexShader: HOLO_VERT, fragmentShader: HOLO_FRAG });
          const edgeMat = new THREE.ShaderMaterial({ ...common, uniforms: uniforms(), vertexShader: EDGE_VERT, fragmentShader: EDGE_FRAG });
          const group = new THREE.Group();
          group.add(new THREE.Mesh(surface, surfaceMat), new THREE.LineSegments(edges, edgeMat));
          pivot.add(group);
          models.push({ group, materials: [surfaceMat, edgeMat], born: performance.now(), dying: null });
          particleMat.color.copy(color);
          onReady();
          kick();
        }).catch(() => {});
      };

      const dispose = () => {
        disposed = true;
        cancelAnimationFrame(raf);
        ro.disconnect();
        io.disconnect();
        stage.removeEventListener("pointermove", onMove);
        stage.removeEventListener("pointerleave", onLeave);
        models.forEach((m) => m.materials.forEach((mat) => mat.dispose()));
        particleGeo.dispose();
        particleMat.dispose();
        renderer.dispose();
        renderer.domElement.remove();
      };

      return { show, dispose };
    }

    function HoloProjector({ layer, index, total }) {
      const stageRef = useRef(null);
      const mountRef = useRef(null);
      const engineRef = useRef(null);
      const layerRef = useRef(layer);
      const [ready, setReady] = useState(false);
      layerRef.current = layer;

      useEffect(() => {
        let cancelled = false;
        loadThree()
          .then((lib) => {
            if (cancelled) return;
            engineRef.current = startHologram(lib, mountRef.current, stageRef.current, () => { if (!cancelled) setReady(true); });
            engineRef.current.show(layerRef.current);
          })
          .catch(() => {}); // sem WebGL ou sem rede: fica o ícone plano com efeito de holograma
        return () => {
          cancelled = true;
          if (engineRef.current) engineRef.current.dispose();
          engineRef.current = null;
        };
      }, []);

      useEffect(() => {
        if (engineRef.current) engineRef.current.show(layer);
      }, [layer.icon, layer.mine]);

      const pad = (n) => String(n).padStart(2, "0");
      return (
        <div ref={stageRef} className={`holo-stage ${layer.mine ? "is-mine" : ""}`} role="img" aria-label={`Holograma 3D da camada ${layer.name}`}>
          <div className="holo-beam" />
          <div className="holo-base"><span /><span /><span /></div>
          {!ready && <i key={layer.icon} className={`bi ${layer.icon} holo-glyph`} aria-hidden="true" />}
          <div className="holo-canvas" ref={mountRef} />
          <div className="holo-scan" />
          <span className="holo-corner tl" /><span className="holo-corner tr" />
          <span className="holo-corner bl" /><span className="holo-corner br" />
          <div className="holo-hud">
            <div><small>CAMADA {pad(index + 1)}/{pad(total)}</small><strong>{layer.name}</strong></div>
            {layer.mine && <span className="mine-badge"><i className="bi bi-star-fill" /> minha atuação</span>}
          </div>
        </div>
      );
    }

    function LayerPanel({ title, tag, layers }) {
      const [active, setActive] = useState(layers.length - 1);
      const legend = layers.map((layer, i) => ({ layer, i })).reverse();

                onClick={() => setActive(i)}
              >

                  <span className="layer-name">
                    <strong>{layer.name}</strong>
                    {layer.mine && <span className="mine-badge"><i className="bi bi-star-fill" /> minha atuação</span>}
                  </span>
                  <small>{layer.source}</small>
                  {layer.mine && layer.role && <span className="layer-role">{layer.role}</span>}
                </span>
              </ListGroup.Item>
            ))}
          </ListGroup>
          {hasMine && (
            <div className="mine-key"><i className="bi bi-star-fill" /> Camadas em que atuo diretamente. As demais fazem parte da plataforma.</div>
          )}

      );
    }

    const formatCount = (v) => (v >= 1000 ? `${(v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} mil` : v.toLocaleString("pt-BR"));

    function RequestsDashboard({ data }) {
      const [ref, inView] = useInView({ threshold: 0.3 });
      const [hover, setHover] = useState(null);
      const { series } = data;
      const max = Math.max(...series.map((d) => d.value));
      const peak = series.findIndex((d) => d.value === max);
      const last = series.length - 1;
      const tipAlign = (i) => (i < 2 ? "start" : i > last - 2 ? "end" : "center");
      return (
        <div className="glass dash-card" ref={ref}>
          <div className="dash-head">
            <span className="dash-title"><span className="live-dot" /> {data.heading}</span>
            <span className="dash-tag">{data.tag}</span>
          </div>
          <div className="dash-kpis">
            {data.kpis.map((k) => (
              <div className={`dash-kpi ${k.tone ? `tone-${k.tone}` : ""}`} key={k.label}>
                <i className={`bi ${k.icon}`} aria-hidden="true" />
                <strong>{k.value}</strong>
                <small>{k.label}</small>
              </div>
            ))}
          </div>
          <div className="dash-chart-title">{data.title}</div>
          <div className={`bars ${inView ? "is-in" : ""}`} aria-hidden="true" onMouseLeave={() => setHover(null)}>
            {series.map((d, i) => (
              <div
                key={d.year}
                className={`bar-col ${hover !== null && hover !== i ? "is-dim" : ""}`}
                style={{ "--h": `${Math.max((d.value / max) * 100, 1.5)}%`, "--d": `${i * 45}ms` }}
                onMouseEnter={() => setHover(i)}
              >
                <div className={`bar ${data.partialLast && i === last ? "is-partial" : ""}`} />
                {i === peak && hover === null && <span className="bar-label">{formatCount(d.value)}</span>}
                {hover === i && (
                  <div className={`bar-tip align-${tipAlign(i)}`}>
                    <strong>{formatCount(d.value)}</strong>
                    <span>{d.year}{data.partialLast && i === last ? " · parcial" : ""}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
          <div className="bar-years" aria-hidden="true">
            {series.map((d, i) => <span key={d.year}>{i % 2 === 0 ? `'${String(d.year).slice(2)}` : ""}</span>)}
          </div>
          <table className="visually-hidden">
            <caption>{data.title}</caption>
            <thead><tr><th>Ano</th><th>Solicitações</th></tr></thead>
            <tbody>{series.map((d) => <tr key={d.year}><td>{d.year}</td><td>{d.value}</td></tr>)}</tbody>
          </table>
          <div className="dash-foot"><i className="bi bi-info-circle me-1" />{data.source}</div>
        </div>
      );
    }

    function CityPane({ project }) {
      return (
        <div className="fade-swap">
          <Row className="gx-4 gx-lg-5 gy-5 align-items-center">
            <Col lg={5}>
              {project.visual === "dashboard"
                ? <RequestsDashboard data={project.dashboard} />
                : <LayerPanel title={project.panelTitle} tag={project.panelTag} layers={project.layers} />}
            </Col>
            <Col lg={7}>
              <span className="city-kicker">{project.kicker}</span>
              <h3 className="city-name">{project.name}</h3>
              <p className="city-pitch">{project.pitch}</p>
              {project.facts && (
                <div className="city-facts">
                  {project.facts.map((f) => (
                    <div className="city-fact" key={f.label}>
                      <strong className="text-gradient">{f.value}</strong>
                      <small>{f.label}</small>
                    </div>
                  ))}
                </div>
              )}
              <h4 className="kicker mt-4 mb-3">Minha contribuição</h4>
              <div className="d-grid gap-3">
                {project.contributions.map((c) => (
                  <div className="contrib" key={c.title}>
                    <span className="contrib-icon"><i className={`bi ${c.icon}`} /></span>
                    <div><h4>{c.title}</h4><p>{c.text}</p></div>
                  </div>
                ))}
              </div>
              <div className="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-4">
                <div className="chip-row">
                  {project.tech.map((t) => <span className="chip" key={t}>{t}</span>)}
                </div>
                {project.url && (
                  <Button variant="ghost" href={project.url} target="_blank" rel="noopener noreferrer">
                    <i className="bi bi-box-arrow-up-right" /> Ver plataforma
                  </Button>
                )}
              </div>
            </Col>
          </Row>
          <div className="glass flow-card">
            <div className="flow-title"><i className="bi bi-signpost-split me-2" />Como os dados chegam ao mapa</div>
            <div className="flow">
              {project.flow.map((step, i) => (
                <React.Fragment key={step}>
                  <div className="flow-step">
                    <span className="idx">{String(i + 1).padStart(2, "0")}</span>
                    <span className="lbl">{step}</span>
                  </div>
                  {i < project.flow.length - 1 && <div className="flow-link" aria-hidden="true" />}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function CitySection() {
      const [key, setKey] = useState(CITY_PROJECTS[0].id);
      return (
        <section id="niteroi" className="section city-section">
          <Container>
            <SectionHeader center kicker="Dados para a cidade" title={<>Niterói em <span className="text-gradient">camadas</span></>}>
              No Escritório de Dados da Prefeitura de Niterói, trabalho com duas plataformas públicas da cidade. No Gêmeo Digital, integro os dados de trânsito, com foco no NitBike. No Colab, integro e mapeio as solicitações dos moradores.
            </SectionHeader>
            <Tab.Container activeKey={key} onSelect={(k) => k && setKey(k)} id="city-tabs">
              <Reveal className="text-center mb-5">
                <Nav variant="pills" className="city-tabs">
                  {CITY_PROJECTS.map((p) => (
                    <Nav.Item key={p.id}>
                      <Nav.Link eventKey={p.id} as="button" type="button"><i className={`bi ${p.icon}`} /> {p.tab}</Nav.Link>
                    </Nav.Item>
                  ))}
                </Nav>
              </Reveal>
              <Reveal delay={100}>
                <Tab.Content>
                  {CITY_PROJECTS.map((p) => (
                    <Tab.Pane eventKey={p.id} key={p.id}>
                      <CityPane project={p} />
                    </Tab.Pane>
                  ))}
                </Tab.Content>
              </Reveal>
            </Tab.Container>
          </Container>
        </section>
      );
    }

    function Experience() {
      return (
        <section id="experiencia" className="section">
          <Container>
            <Row className="gx-4 gx-lg-5 gy-5">
              <Col lg={4}>
                <SectionHeader kicker="Trajetória" title={<>Experiência e <span className="text-gradient">formação</span></>}>
                  Da pesquisa na universidade à engenharia de dados no setor público.
                </SectionHeader>
                <Reveal delay={100} className="glass edu-card">
                  <span className="fact-icon"><i className="bi bi-mortarboard" /></span>
                  <div>
                    <div className="tl-period">{EDUCATION.period}</div>
                    <div className="fw-semibold">{EDUCATION.course}</div>
                    <div className="text-muted-km small">{EDUCATION.school} · {EDUCATION.place}</div>
                  </div>
                </Reveal>
              </Col>
              <Col lg={8}>
                <div className="timeline">
                  {EXPERIENCE.map((job, i) => (
                    <Reveal className="tl-item" key={job.role} delay={i * 120}>
                      <span className="tl-dot" />
                      <div className="glass tl-card">
                        <div className="d-flex flex-wrap justify-content-between gap-2">
                          <span className="tl-period">{job.period}</span>
                          <span className="text-muted-km small"><i className="bi bi-geo-alt me-1" />{job.place}</span>
                        </div>
                        <h3 className="tl-role">{job.role}</h3>
                        <div className="tl-org">{job.org}</div>
                        <ul className="tl-list">
                          {job.bullets.map((b) => {
                            const item = typeof b === "string" ? { text: b } : b;
                            return <li key={item.text} className={item.isNew ? "is-new" : ""}>{item.text}</li>;
                          })}
                        </ul>
                        <div className="chip-row">{job.tech.map((t) => <span className="chip" key={t}>{t}</span>)}</div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </Col>
            </Row>
          </Container>
        </section>
      );
    }

    function ProjectLinks({ project, onClick }) {
      return (
        <>
          {project.repo && (
            <a className="icon-btn" href={project.repo} target="_blank" rel="noopener noreferrer" aria-label={`Código de ${project.title} no GitHub`} onClick={onClick}>
              <i className="bi bi-github" />
            </a>
          )}
          {project.demo && (
            <a className="icon-btn" href={project.demo} target="_blank" rel="noopener noreferrer" aria-label={`Abrir ${project.title}`} onClick={onClick}>
              <i className="bi bi-box-arrow-up-right" />
            </a>
          )}
        </>
      );
    }

    function Projects() {
      const [filter, setFilter] = useState("todos");
      const [selected, setSelected] = useState(null);
      const visible = useMemo(() => PROJECTS.filter((p) => filter === "todos" || p.category.includes(filter)), [filter]);
      const countFor = (id) => (id === "todos" ? PROJECTS.length : PROJECTS.filter((p) => p.category.includes(id)).length);
      const stop = (e) => e.stopPropagation();

      return (
        <section id="projetos" className="section">
          <Container>
            <SectionHeader center kicker="Projetos" title={<>Coisas que eu <span className="text-gradient">construí</span></>}>
              Projetos pessoais desenvolvidos de ponta a ponta, com testes, CI e deploy. Clique em um card para ver os detalhes.
            </SectionHeader>
            <Reveal className="filters" role="group" aria-label="Filtrar projetos">
              {FILTERS.map((f) => (
                <button key={f.id} type="button" className={`filter-btn ${filter === f.id ? "active" : ""}`} aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>
                  {f.label}<span className="count">{countFor(f.id)}</span>
                </button>
              ))}
            </Reveal>
            <Row className="g-4" key={filter}>
              {visible.map((p, i) => (
                <Col md={6} key={p.id} className="fade-swap" style={{ animationDelay: `${i * 70}ms` }}>
                  <TiltCard
                    className="glass project-card"
                    role="button"
                    tabIndex={0}
                    aria-label={`Ver detalhes de ${p.title}`}
                    onClick={() => setSelected(p)}
                    onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSelected(p); } }}
                  >
                    <div className="project-top">
                      <span className="project-icon"><i className={`bi ${p.icon}`} /></span>
                      <span className="project-meta"><span className="yr">{p.year}</span>{p.kind}</span>
                    </div>
                    <span className="project-highlight"><i className="bi bi-lightning-charge-fill" />{p.highlight}</span>
                    <h3 className="project-title">{p.title}</h3>
                    <p className="project-summary">{p.summary}</p>
                    <div className="chip-row">{p.tech.slice(0, 4).map((t) => <span className="chip" key={t}>{t}</span>)}{p.tech.length > 4 && <span className="chip">+{p.tech.length - 4}</span>}</div>
                    <div className="project-actions">
                      <span className="link-arrow">Detalhes <i className="bi bi-arrow-right" /></span>
                      <div className="d-flex gap-2"><ProjectLinks project={p} onClick={stop} /></div>
                    </div>
                  </TiltCard>
                </Col>
              ))}
            </Row>
          </Container>

          <Modal show={!!selected} onHide={() => setSelected(null)} centered size="lg" contentClassName="km-modal">
            {selected && (
              <>
                <Modal.Header closeButton>
                  <div className="d-flex align-items-center gap-3">
                    <span className="project-icon"><i className={`bi ${selected.icon}`} /></span>
                    <div>
                      <Modal.Title as="h3" className="h4 mb-1">{selected.title}</Modal.Title>
                      <div className="text-muted-km small font-mono">{selected.year} · {selected.kind}</div>
                    </div>
                  </div>
                </Modal.Header>
                <Modal.Body>
                  <ul className="tl-list mt-0">
                    {selected.bullets.map((b) => <li key={b}>{b}</li>)}
                  </ul>
                  <div className="chip-row">{selected.tech.map((t) => <span className="chip" key={t}>{t}</span>)}</div>
                </Modal.Body>
                <Modal.Footer>
                  {selected.repo && <Button variant="km" href={selected.repo} target="_blank" rel="noopener noreferrer"><i className="bi bi-github" /> Ver código</Button>}
                  {selected.demo && <Button variant="ghost" href={selected.demo} target="_blank" rel="noopener noreferrer"><i className="bi bi-box-arrow-up-right" /> Abrir projeto</Button>}
                  <Button variant="ghost" onClick={() => setSelected(null)}>Fechar</Button>
                </Modal.Footer>
              </>
            )}
          </Modal>
        </section>
      );
    }

    function SkillIcon({ item }) {
      return item.d ? <i className={`${item.d}`} /> : <i className={`bi ${item.bi}`} />;
    }

    function Skills() {
      const all = SKILLS.flatMap((g) => g.items);
      return (
        <section id="habilidades" className="section">
          <Container>
            <SectionHeader center kicker="Habilidades" title={<>Minha <span className="text-gradient">caixa de ferramentas</span></>}>
              Tecnologias que uso no desenvolvimento de APIs, pipelines de dados e automações.
            </SectionHeader>
            <Row className="g-4 justify-content-center">
              {SKILLS.map((g, i) => (
                <Col md={6} lg={4} key={g.group}>
                  <Reveal delay={(i % 3) * 100} className="glass skill-card">
                    <div className="skill-head">
                      <span className="fact-icon"><i className={`bi ${g.icon}`} /></span>
                      <h3>{g.group}</h3>
                    </div>
                    <div className="skill-list">
                      {g.items.map((item) => (
                        <span className="skill" key={item.n}><SkillIcon item={item} />{item.n}</span>
                      ))}
                    </div>
                  </Reveal>
                </Col>
              ))}
            </Row>
          </Container>
          <div className="marquee" aria-hidden="true">
            <div className="marquee-track">
              {[...all, ...all].map((item, i) => (
                <span className="marquee-item" key={i}><SkillIcon item={item} />{item.n}</span>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Contact({ onCopy }) {
      return (
        <section id="contato" className="section">
          <Container>
            <Reveal className="contact-card text-center">
              <span className="kicker">Contato</span>
              <h2 className="mt-3">Vamos <span className="text-gradient">conversar?</span></h2>
              <p>Tenho interesse em oportunidades e projetos de backend, engenharia de dados e tecnologia para o setor público. O contato mais rápido é por e-mail.</p>
              <div className="contact-email mb-4">{PROFILE.email}</div>
              <div className="d-flex flex-wrap justify-content-center gap-3">
                <Button variant="km" href={`mailto:${PROFILE.email}`}><i className="bi bi-envelope" /> Enviar e-mail</Button>
                <Button variant="ghost" onClick={onCopy}><i className="bi bi-clipboard" /> Copiar e-mail</Button>
                <Button variant="ghost" href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer"><i className="bi bi-linkedin" /> LinkedIn</Button>
                <Button variant="ghost" href={PROFILE.github} target="_blank" rel="noopener noreferrer"><i className="bi bi-github" /> GitHub</Button>
              </div>
            </Reveal>
          </Container>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <Container className="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 text-center">
            <span>© {new Date().getFullYear()} {PROFILE.name} · Feito com React e Bootstrap</span>
            <span className="d-flex gap-3">
              <a href={PROFILE.github} target="_blank" rel="noopener noreferrer"><i className="bi bi-github me-1" />GitHub</a>
              <a href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer"><i className="bi bi-linkedin me-1" />LinkedIn</a>
              <a href={`mailto:${PROFILE.email}`}><i className="bi bi-envelope me-1" />E-mail</a>
            </span>
          </Container>
        </footer>
      );
    }

    function ScrollChrome() {
      const barRef = useRef(null);
      const [showTop, setShowTop] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          const doc = document.documentElement;
          const max = doc.scrollHeight - doc.clientHeight;
          if (barRef.current) barRef.current.style.transform = `scaleX(${max > 0 ? doc.scrollTop / max : 0})`;
          setShowTop(doc.scrollTop > 700);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
      }, []);
      return (
        <>
          <div className="scroll-progress" ref={barRef} />
          <button className={`to-top ${showTop ? "show" : ""}`} onClick={() => window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? "auto" : "smooth" })} aria-label="Voltar ao topo">
            <i className="bi bi-arrow-up" />
          </button>
        </>
      );
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }

    function App() {
      const [theme, toggleTheme] = useTheme();
      const active = useScrollSpy(["inicio", ...NAV.map((n) => n.id)]);
      const [toast, setToast] = useState(false);

      useEffect(() => {
        const pre = document.getElementById("preloader");
        if (!pre) return;
        pre.classList.add("done");
        const t = setTimeout(() => pre.remove(), 700);
        return () => clearTimeout(t);
      }, []);

      const onCopy = async () => { await copyText(PROFILE.email); setToast(true); };

      return (
        <>
          <ScrollChrome />
          <TopNav active={active} theme={theme} onToggleTheme={toggleTheme} />
          <main>
            <Hero theme={theme} />
            <About />
            <CitySection />
            <Experience />
            <Projects />
            <Skills />
            <Contact onCopy={onCopy} />
          </main>
          <Footer />
          <ToastContainer className="toast-dock p-3">
            <Toast show={toast} onClose={() => setToast(false)} delay={2200} autohide className="km-toast">
              <Toast.Body><i className="bi bi-check2-circle me-2" />E-mail copiado!</Toast.Body>
            </Toast>
          </ToastContainer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
