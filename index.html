    [data-bs-theme="dark"] #preloader .spinner-grow { color: var(--neon-c) !important; }
    [data-bs-theme="dark"] #preloader-msg { color: #bff6ff; font-family: "Share Tech Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    

    /* ================= Gêmeo ao vivo: mini Gêmeo do NitBike e orquestração no Prefect ================= */
    .live-card { margin-top: 1.6rem; padding: 1.4rem 1.5rem 1.2rem; }
    .live-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
    .live-head p { max-width: 640px; margin: .5rem 0 0; color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .live-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.3rem; align-items: start; }
    .live-map-wrap { min-width: 0; }
    .live-map { display: block; width: 100%; aspect-ratio: 300 / 250; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); }
    .live-streets { opacity: .32; }
    .live-st { cursor: pointer; }
    .live-st-halo { fill: transparent; }
    .live-st-bg { fill: var(--card); stroke: color-mix(in srgb, var(--line) 30%, transparent); stroke-width: 2.2; }
    .live-st-fill { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; transition: stroke-dasharray .4s; }
    .live-st.hot .live-st-halo { fill: rgba(var(--accent-rgb), .25); }
    .live-st.hot .live-st-fill { stroke: var(--accent); }
    .live-st.cold .live-st-halo { fill: color-mix(in srgb, var(--blue) 22%, transparent); }
    .live-st.sel .live-st-bg { stroke: var(--ink); stroke-width: 2.8; }
    .live-st text { font: 700 7.4px "JetBrains Mono", monospace; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
    .live-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.1rem; margin-top: .8rem; }
    .live-controls .form-check { margin: 0; font-size: .86rem; }
    .live-controls .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
    .live-pause { margin-left: auto; padding: .3rem .75rem; border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: 700 .78rem "JetBrains Mono", monospace; }
    .live-legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .55rem; color: var(--muted); font: .72rem "JetBrains Mono", monospace; }
    .live-legend i { display: inline-block; width: 10px; height: 10px; margin-right: .3rem; border-radius: 50%; vertical-align: -1px; }
    .lg-st { border: 2px solid var(--blue); background: var(--card); }
    .lg-hot { background: var(--accent); }
    .lg-cold { background: var(--blue); }
    .live-side { display: grid; gap: .9rem; min-width: 0; }
    .live-clock { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: .5rem; border-bottom: 2px dashed color-mix(in srgb, var(--line) 30%, transparent); }
    .live-clock span { font: 800 1.6rem "JetBrains Mono", monospace; }
    .live-clock small, .pf-runs-head small, .live-ranks small, .pf-info small, .nb-cap { color: var(--muted); font: .7rem "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .live-hint { margin: 0; color: var(--muted); font-size: .84rem; }
    .live-detail { padding: .7rem .8rem; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); }
    .live-detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
    .live-detail-head button { border: 0; background: none; color: var(--muted); }
    .live-fill { height: 10px; margin-bottom: .55rem; border: 1.5px solid var(--line); background: var(--card); }
    .live-fill .progress-bar { background: var(--blue); }
    .live-kv { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .2rem .6rem; font-size: .82rem; }
    .live-kv span { color: var(--muted); }
    .live-table { width: 100%; border-collapse: collapse; font: .82rem "JetBrains Mono", monospace; }
    .live-table th { padding: .2rem .3rem; color: var(--muted); font-weight: 500; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; text-align: right; }
    .live-table th:first-child, .live-table td:first-child { text-align: left; }
    .live-table td { padding: .28rem .3rem; text-align: right; border-top: 1px solid color-mix(in srgb, var(--line) 18%, transparent); }
    .live-table tfoot td { font-weight: 800; border-top: 2px solid var(--line); }
    .live-table .o { color: var(--accent); }
    .live-table .i { color: var(--good); }
    .live-ranks { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
    .live-rank { position: relative; display: flex; justify-content: space-between; gap: .4rem; margin-top: .35rem; padding-bottom: .3rem; font-size: .8rem; }
    .live-rank span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .live-rank i { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 2px; transition: width .4s; }
    .live-rank i.o { background: var(--accent); }
    .live-rank i.i { background: var(--good); }
    .live-note { margin: 1rem 0 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }

    .pf-fronts { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
    .pf-fronts button { padding: .3rem .8rem; border: 2px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 700 .78rem "JetBrains Mono", monospace; }
    .pf-fronts button.on { background: var(--ink); color: var(--paper); }
    .dim { opacity: .22; }
    .pf-bottom { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.3rem; margin-top: 1rem; }
    .pf-runs-head { display: flex; justify-content: space-between; gap: .6rem; margin-bottom: .4rem; }
    .pf-lane { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); align-items: center; gap: .6rem; padding: .45rem 0; border-top: 1px solid color-mix(in srgb, var(--line) 18%, transparent); font: 700 .78rem "JetBrains Mono", monospace; transition: opacity .25s; }
    .pf-lane > div { position: relative; height: 14px; }
    .pf-lane i { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; }
    .pf-lane i.ok, .pf-count i.ok { background: var(--good); }
    .pf-lane i.retry, .pf-count i.retry { background: var(--warn); }
    .pf-lane i.fail, .pf-count i.fail { background: #e5484d; }
    .pf-lane i.running { background: var(--accent); }
    .pf-lane i.waiting { border: 2px solid var(--warn); background: transparent; }
    .pf-count { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1rem; margin-top: .5rem; font: .74rem "JetBrains Mono", monospace; color: var(--muted); }
    .pf-count i { display: inline-block; width: 8px; height: 8px; margin-right: .25rem; border-radius: 50%; }
    .pf-info { padding: .8rem .9rem; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); }
    .pf-info p { margin: .4rem 0 .6rem; font-size: .9rem; line-height: 1.55; }
    @media (max-width: 991.98px) { .live-grid, .pf-bottom { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 575.98px) { .live-card { padding: 1.1rem 1rem; } .live-head { flex-direction: column; } }
    [data-bs-theme="dark"] .live-map { background: #04030c; border-color: rgba(0, 229, 255, .3); }
    [data-bs-theme="dark"] .live-streets { opacity: .35; }
    [data-bs-theme="dark"] .live-st text { stroke: #04030c; }
    [data-bs-theme="dark"] .live-detail, [data-bs-theme="dark"] .pf-info { border-color: rgba(0, 229, 255, .35); }
    [data-bs-theme="dark"] .pf-fronts button { border-radius: 2px; border-color: rgba(0, 229, 255, .4); background: transparent; font-family: "Share Tech Mono", monospace; }
    [data-bs-theme="dark"] .pf-fronts button.on { background: var(--neon-c); color: #05040f; }
    [data-bs-theme="dark"] .live-pause { border-radius: 2px; border-color: rgba(0, 229, 255, .5); background: transparent; color: var(--neon-c); }
    [data-bs-theme="dark"] .live-clock span { color: #fff; text-shadow: 0 0 12px rgba(0, 229, 255, .6); }
  
    /* ===== desenho de fluxo (pipeline do NitBike, Prefect e n8n): caixas em HTML sobre linhas e bolinhas em SVG ===== */
    /* --u é uma unidade do desenho, em pixels da largura atual: tudo escala junto, como um SVG */
    .fx-wrap { container-type: inline-size; }
    .fx-canvas {
      position: relative; width: 100%; border: 2px solid var(--line); border-radius: 14px; overflow: hidden;
      background-color: var(--paper);
      background-image: radial-gradient(circle, color-mix(in srgb, var(--line) 14%, transparent) 1px, transparent 1.4px);
      background-size: calc(var(--u) * 20) calc(var(--u) * 20);
    }
    .fx-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .fx-edge {
      fill: none; stroke: color-mix(in srgb, var(--line) 30%, transparent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 5 7; animation: fxFlow 1.6s linear infinite; transition: stroke .8s ease, stroke-width .8s ease, opacity .5s;
    }
    .fx-edge.on { stroke: rgba(var(--accent-rgb), .7); stroke-width: 2.4; }
    .fx-edge.ok { stroke: color-mix(in srgb, var(--good) 70%, transparent); stroke-dasharray: none; }
    .fx-edge.dim { opacity: .25; }
    @keyframes fxFlow { to { stroke-dashoffset: -24; } }
    .fx-s0 { stop-color: rgba(var(--accent-rgb), .6); }
    .fx-s1 { stop-color: rgba(var(--accent-rgb), 0); }
    .fx-f0 { stop-color: rgba(229, 72, 77, .6); }
    .fx-f1 { stop-color: rgba(229, 72, 77, 0); }
    .fx-r0 { stop-color: color-mix(in srgb, var(--blue) 60%, transparent); }
    .fx-r1 { stop-color: color-mix(in srgb, var(--blue) 0%, transparent); }
    .fx-halo { fill: url(#fx-halo); }
    .fx-core, .fx-trail { fill: var(--accent); }
    .fx-core { stroke: #fff; stroke-width: 1.4; }
    .fx-pkt.fail .fx-halo { fill: url(#fx-halo-fail); }
    .fx-pkt.fail .fx-core, .fx-pkt.fail .fx-trail { fill: #e5484d; }
    .fx-pkt.read .fx-halo { fill: url(#fx-halo-read); }
    .fx-pkt.read .fx-core, .fx-pkt.read .fx-trail { fill: var(--blue); }
    .fx-box {
      position: absolute; box-sizing: border-box; display: flex; flex-direction: column; gap: calc(var(--u) * 8);
      padding: calc(var(--u) * 10) calc(var(--u) * 12); border: 2px solid var(--line); border-radius: calc(var(--u) * 12);
      background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 82%, var(--paper)));
      box-shadow: 3px 3px 0 var(--shadow-c); cursor: pointer; overflow: hidden; transition: border-color .7s ease, box-shadow .7s ease, background-color .7s ease;
    }
    .fx-box.busy { border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u) * 4) rgba(var(--accent-rgb), .16), 3px 3px 0 var(--accent); }
    .fx-box.fail { border-color: #e5484d; box-shadow: 0 0 0 calc(var(--u) * 4) rgba(229, 72, 77, .16), 3px 3px 0 #e5484d; }
    .fx-box.sel { outline: 2px dashed rgba(var(--accent-rgb), .7); outline-offset: 3px; }
    .fx-box.fx-worker { background: color-mix(in srgb, var(--blue) 5%, var(--card)); }
    .fx-box.fx-prefect .fx-ic { background: var(--ink); color: var(--card); }
    .fx-head { display: flex; align-items: center; gap: calc(var(--u) * 9); min-width: 0; }
    .fx-ic { flex: none; display: grid; place-items: center; width: calc(var(--u) * 30); height: calc(var(--u) * 30); border-radius: calc(var(--u) * 9); background: rgba(var(--accent-rgb), .13); color: var(--accent); font-size: calc(var(--u) * 15); }
    .fx-box.fail .fx-ic { background: rgba(229, 72, 77, .14); color: #e5484d; }
    .fx-tt { display: grid; min-width: 0; line-height: 1.2; }
    .fx-tt b { overflow: hidden; color: var(--ink); font: 700 calc(var(--u) * 14.5) "Bricolage Grotesque", sans-serif; white-space: nowrap; text-overflow: ellipsis; }
    .fx-tt small { overflow: hidden; color: var(--muted); font: calc(var(--u) * 10.5) "JetBrains Mono", monospace; white-space: nowrap; text-overflow: ellipsis; }
    /* no celular os títulos quebram linha; nas caixas pequenas do Prefect, sem ícone */
    .fx-canvas.narrow .fx-tt b, .fx-canvas.narrow .fx-tt small { white-space: normal; }
    .fx-canvas.compact .fx-ic { display: none; }
    .fx-canvas.compact .fx-box { padding: calc(var(--u) * 8); }
    .fx-canvas.compact .fx-tt b { font-size: calc(var(--u) * 13); }
    .fx-canvas.compact .fx-tt small { font-size: calc(var(--u) * 9.5); }
    /* linhas de flow dentro do worker */
    .fx-row {
      position: absolute; z-index: 1; box-sizing: border-box; display: flex; align-items: center; gap: calc(var(--u) * 10);
      padding: 0 calc(var(--u) * 12); border: 1.5px solid color-mix(in srgb, var(--line) 35%, transparent); border-radius: calc(var(--u) * 9);
      background: var(--paper); cursor: pointer; transition: border-color .25s, box-shadow .25s, opacity .25s;
    }
    .fx-row.dim { opacity: .3; }
    .fx-row.sel { outline: 2px dashed rgba(var(--accent-rgb), .7); outline-offset: 2px; }
    .fx-row.pending, .fx-row.running, .fx-row.retrying { border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u) * 3) rgba(var(--accent-rgb), .14); }
    .fx-row.ok { border-color: color-mix(in srgb, var(--good) 70%, transparent); }
    .fx-row.waiting { border-color: var(--warn); }
    .fx-row.fail { border-color: #e5484d; box-shadow: 0 0 0 calc(var(--u) * 3) rgba(229, 72, 77, .14); }
    .fx-dot { flex: none; width: calc(var(--u) * 9); height: calc(var(--u) * 9); border-radius: 50%; background: var(--good); }
    .fx-row.pending .fx-dot, .fx-row.running .fx-dot, .fx-row.retrying .fx-dot { background: var(--accent); animation: blink 1s steps(1) infinite; }
    .fx-row.waiting .fx-dot { background: var(--warn); }
    .fx-row.fail .fx-dot { background: #e5484d; }
    .fx-row-name { flex: 1; min-width: 0; overflow: hidden; color: var(--muted); font: calc(var(--u) * 11.5) "JetBrains Mono", monospace; white-space: nowrap; text-overflow: ellipsis; }
    .fx-row-name b { color: var(--ink); font-weight: 800; }
    .fx-every { flex: none; color: var(--muted); font: calc(var(--u) * 11) "JetBrains Mono", monospace; }
    .fx-state { flex: none; padding: calc(var(--u) * 2) calc(var(--u) * 8); border-radius: 999px; background: var(--accent); color: #15130f; font: 700 calc(var(--u) * 10) "JetBrains Mono", monospace; }
    .fx-state.pending { background: color-mix(in srgb, var(--line) 16%, transparent); color: var(--ink); }
    .fx-state.ok { background: var(--good); color: #fff; }
    .fx-state.waiting { background: var(--warn); }
    .fx-state.fail { background: #e5484d; color: #fff; }
    @media (prefers-reduced-motion: reduce) { .fx-edge { animation: none; } }

    /* pipeline do NitBike: o PostgreSQL com os snapshots e os passos da publicação */
    .nb-pipe { margin-top: 1.3rem; }
    .nb-info { margin-top: .8rem; }
    .nb-grid { flex: 1; display: grid; gap: calc(var(--u) * 4); min-height: 0; }
    .nb-col { display: grid; grid-template-rows: repeat(12, 1fr); gap: calc(var(--u) * 2); animation: liveIn .5s ease-out; transition: opacity .3s; }
    .nb-col i { border-radius: calc(var(--u) * 2); background: var(--blue); transition: background-color .3s; }
    .nb-col.read i { background: var(--accent); }
    .nb-col.old { opacity: .22; }
    .nb-col.empty { border: 1.5px dashed color-mix(in srgb, var(--line) 25%, transparent); border-radius: calc(var(--u) * 3); animation: none; }
    .nb-steps { display: grid; gap: calc(var(--u) * 8); margin: 0; padding: 0; list-style: none; }
    .nb-steps li { display: flex; align-items: center; gap: calc(var(--u) * 8); color: var(--muted); font: calc(var(--u) * 11) "JetBrains Mono", monospace; }
    .nb-steps li::before { content: ""; flex: none; width: calc(var(--u) * 9); height: calc(var(--u) * 9); border: 1.5px solid color-mix(in srgb, var(--line) 40%, transparent); border-radius: 50%; transition: background-color .2s, border-color .2s; }
    .nb-steps li.on { color: var(--ink); }
    .nb-steps li.on::before { border-color: var(--accent); background: var(--accent); }
    .nb-steps li.done::before { border-color: var(--good); background: var(--good); }
    .nb-diff { font: 800 8px "JetBrains Mono", monospace; paint-order: stroke; stroke: var(--paper); stroke-width: 2.5px; }
    .nb-diff.in { fill: var(--good); }
    .nb-diff.out { fill: var(--accent); }
    .nb-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
    .nb-kpis div { display: grid; padding: .45rem .55rem; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); transition: border-color .3s; }
    .nb-kpis div.warn { border-color: #e5484d; }
    .nb-kpis b { font: 800 1.25rem "JetBrains Mono", monospace; line-height: 1.1; }
    .nb-kpis b span { margin-left: .15rem; font-size: .7rem; }
    .nb-kpis small { color: var(--muted); font-size: .72rem; }
    .nb-cap { display: block; margin-bottom: .3rem; }
    .live-table tr.fail td { color: #e5484d; font-style: italic; }

    /* mini Gêmeo: ônibus, lentidão e alertas do Waze, pluviômetros, eventos simulados e estado das camadas */
    .bi-glyph { font-family: "bootstrap-icons"; font-size: 6.2px; }
    .city-jam { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; transition: stroke .6s; }
    .city-jam.l1 { stroke: #f2c94c; }
    .city-jam.l2 { stroke: #f2a33a; }
    .city-jam.l3 { stroke: #ee7d2b; }
    .city-jam.l4 { stroke: #e5484d; }
    .city-jam.l5 { stroke: #a4161a; }
    .city-busline { fill: none; stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; stroke-dasharray: 1 3; }
    .city-bus { transition: none; }
    .city-bus circle { fill: var(--ink); stroke: var(--card); stroke-width: 1.2; }
    .city-bus .bi-glyph { fill: var(--card); }
    .city-rain-mm { font: 700 6.4px "JetBrains Mono", monospace; fill: #2563eb; paint-order: stroke; stroke: var(--paper); stroke-width: 2.4px; }
    .city-alert circle { fill: #f59e0b; stroke: var(--card); stroke-width: 1.2; }
    .city-alert .bi-glyph { fill: #15130f; }
    .city-alert.acidente circle { fill: #e5484d; }
    .city-alert.alagamento circle { fill: #3b82f6; }
    .city-alert.acidente .bi-glyph, .city-alert.alagamento .bi-glyph { fill: #fff; }
    .live-st-pulse { fill: none; stroke: var(--accent); stroke-width: 1.2; }
    .lg-bus { background: var(--ink); }
    .lg-jam { width: 18px !important; height: 5px !important; border-radius: 3px !important; background: linear-gradient(90deg, #f2c94c, #e5484d, #a4161a); }
    .lg-alert { background: #f59e0b; }
    .lg-rain { border: 1.5px solid rgba(59, 130, 246, .75); background: rgba(59, 130, 246, .25); }
    .city-events { margin-top: .9rem; padding: .7rem .8rem; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); }
    .city-ev-btns { display: flex; flex-wrap: wrap; gap: .4rem; margin: .45rem 0 .6rem; }
    .city-ev-btns button { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .7rem; border: 2px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 700 .78rem "DM Sans", sans-serif; transition: background-color .2s, border-color .2s; }
    .city-ev-btns button:hover:not(:disabled) { background: rgba(var(--accent-rgb), .12); }
    .city-ev-btns button.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .14); opacity: 1; }
    .city-ev-btns em { color: var(--muted); font-style: normal; font-weight: 500; }
    .city-log { display: grid; gap: .3rem; margin: 0; padding: 0; list-style: none; font-size: .8rem; line-height: 1.45; }
    .city-log li { padding-left: .55rem; border-left: 3px solid color-mix(in srgb, var(--line) 25%, transparent); animation: liveIn .4s ease-out; }
    .city-log li.fail { border-color: #e5484d; }
    .city-log li.warn { border-color: var(--warn); }
    .city-log li.ok { border-color: var(--good); }
    .city-log li.muted { color: var(--muted); }
    .city-log b { margin-right: .25rem; font: 700 .72rem "JetBrains Mono", monospace; }
    .city-layers { display: grid; gap: .35rem; }
    .city-layer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .55rem; padding: .4rem .55rem; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); transition: border-color .3s; }
    .city-layer > i { color: var(--good); }
    .city-layer span { display: grid; line-height: 1.2; }
    .city-layer b { font-size: .84rem; }
    .city-layer small { color: var(--muted); font: .7rem "JetBrains Mono", monospace; }
    .city-layer em { color: var(--muted); font: .68rem "JetBrains Mono", monospace; font-style: normal; text-align: right; }
    .city-layer.retry { border-color: var(--warn); }
    .city-layer.retry > i, .city-layer.retry em { color: #b7791f; }
    .city-layer.stale { border-color: #e5484d; }
    .city-layer.stale > i, .city-layer.stale em { color: #e5484d; }

    /* Prefect: barra com o filtro e o botão de falha, faixa de informação e logs */
    .pf-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1rem; margin-bottom: .8rem; }
    .pf-toolbar .pf-fronts { margin: 0; }
    .pf-fail { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
    .pf-fail small, .city-events small, .pf-log small { margin-right: .2rem; color: var(--muted); font: 700 .7rem "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .pf-fail button { padding: .25rem .65rem; border: 2px solid #e5484d; border-radius: 999px; background: transparent; color: #c2333a; font: 700 .74rem "JetBrains Mono", monospace; transition: background-color .2s; }
    .pf-fail button:hover:not(:disabled) { background: rgba(229, 72, 77, .1); }
    .pf-fail button:disabled { opacity: .45; }
    .pf-info-strip { margin-top: .8rem; }
    .pf-info-strip p { margin-bottom: 0; }
    .pf-log ul { display: grid; gap: .35rem; margin: .45rem 0 0; padding: 0; list-style: none; font: .74rem/1.45 "JetBrains Mono", monospace; }
    .pf-log li { padding: .3rem .5rem; border-left: 3px solid color-mix(in srgb, var(--line) 30%, transparent); border-radius: 0 6px 6px 0; background: var(--paper); animation: liveIn .4s ease-out; }
    .pf-log li.ok { border-color: var(--good); }
    .pf-log li.warn { border-color: var(--warn); }
    .pf-log li.fail { border-color: #e5484d; }
    .pf-log li.muted { color: var(--muted); }
    .pf-log b { color: var(--muted); font-weight: 500; }
    .fx-state-txt { font-weight: 800; }

    /* n8n em raias, como o fluxograma: sistema de chamados em cima, n8n embaixo */
    .nf2-scroll { overflow-x: auto; }
    .nf2-lane { position: absolute; left: 1%; right: 1%; border-radius: calc(var(--u) * 10); background: color-mix(in srgb, #3b82f6 7%, transparent); }
    .nf2-lane.n8n { background: color-mix(in srgb, #f59e0b 9%, transparent); }
    .nf2-lane.n8n span { text-transform: none; }
    .nf2-lane span { position: absolute; top: calc(var(--u) * 4); right: calc(var(--u) * 9); color: var(--muted); font: 700 calc(var(--u) * 8.5) "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .nf2-node {
      position: absolute; z-index: 1; box-sizing: border-box; display: flex; align-items: center; gap: calc(var(--u) * 6);
      padding: calc(var(--u) * 4) calc(var(--u) * 6); border: 1.5px solid var(--line); border-radius: calc(var(--u) * 8);
      background: var(--card); box-shadow: 2px 2px 0 var(--shadow-c); transition: border-color .25s, box-shadow .25s;
    }
    .nf2-node.manual { background: color-mix(in srgb, #3b82f6 6%, var(--card)); }
    .nf2-node.gray { border-style: dashed; background: color-mix(in srgb, var(--line) 8%, var(--card)); }
    .nf2-node.error { border-style: dashed; border-color: #e5484d; }
    .nf2-node.running, .nf2-node.waiting { border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u) * 3) rgba(var(--accent-rgb), .18), 2px 2px 0 var(--accent); }
    .nf2-node.ok { border-color: var(--good); }
    .nf2-node.passed { border-color: #3b82f6; }
    .nf2-node.fail { border-color: #e5484d; box-shadow: 0 0 0 calc(var(--u) * 3) rgba(229, 72, 77, .16), 2px 2px 0 #e5484d; }
    .nf2-node.dec { justify-content: center; padding: 0; border: 0; background: none; box-shadow: none; }
    .nf2-node.dec::before, .nf2-node.dec::after { content: ""; position: absolute; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); transition: background-color .25s; }
    .nf2-node.dec::before { inset: 0; background: var(--line); }
    .nf2-node.dec::after { inset: 2px 3px; background: var(--card); }
    .nf2-node.dec.running::before { background: var(--accent); }
    .nf2-node.dec.ok::before { background: var(--good); }
    .nf2-node.dec.fail::before { background: #e5484d; }
    .nf2-node.dec > b { position: relative; z-index: 1; font: 700 calc(var(--u) * 10) "DM Sans", sans-serif; }
    .nf2-ic { flex: none; display: grid; place-items: center; width: calc(var(--u) * 17); height: calc(var(--u) * 17); border-radius: calc(var(--u) * 5); background: rgba(var(--accent-rgb), .13); color: var(--accent); font-size: calc(var(--u) * 11); }
    .nf2-node.manual .nf2-ic { background: color-mix(in srgb, #3b82f6 14%, transparent); color: #2563eb; }
    .nf2-node.error .nf2-ic { background: rgba(229, 72, 77, .12); color: #e5484d; }
    .nf2-tt { display: grid; min-width: 0; line-height: 1.15; }
    .nf2-tt b { color: var(--ink); font: 700 calc(var(--u) * 10.4) / 1.1 "DM Sans", sans-serif; overflow-wrap: anywhere; }
    .nf2-tt small { color: var(--muted); font: calc(var(--u) * 8.8) "DM Sans", sans-serif; }
    .nf2-node .nf-badge { left: auto; right: calc(var(--u) * -6); top: calc(var(--u) * -6); width: calc(var(--u) * 15); height: calc(var(--u) * 15); font-size: calc(var(--u) * 8); }
    .nf2-edge.alt { stroke: rgba(229, 72, 77, .5); }
    .nf2-lbl { font: 700 9px "JetBrains Mono", monospace; fill: var(--muted); }
    .nf2-lbl.alt { fill: #e5484d; }
    .nf2-hint { display: none; margin-top: .35rem; color: var(--muted); font: .7rem "JetBrains Mono", monospace; }
    @media (max-width: 575.98px) { .nf2-scroll .fx-wrap { min-width: 460px; } .nf2-hint { display: block; } }

    /* Foundry: a janela do agente e, à parte, o editor com a consulta DAX */
    .art-foundry { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .9rem; align-items: center; padding: .9rem; }
    .f-win { display: flex; flex-direction: column; overflow: hidden; border: 2px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 3px 3px 0 var(--shadow-c); }
    .f-bar { display: flex; align-items: center; gap: .55rem; padding: .55rem .7rem; border-bottom: 2px solid var(--line); background: var(--paper); }
    .f-avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #15130f; }
    .f-id { display: grid; line-height: 1.15; }
    .f-id b { font-size: .84rem; }
    .f-id small { color: var(--muted); font: .66rem "JetBrains Mono", monospace; }
    .f-online { width: 8px; height: 8px; margin-left: auto; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
    .f-chat { display: flex; flex-direction: column; gap: .55rem; min-height: 200px; padding: .75rem; }
    .f-step { opacity: 0; }
    .art.is-static .f-step, .art.is-static .f-dax-line { opacity: 1; }
    .f-msg { max-width: 92%; padding: .5rem .7rem; border: 2px solid var(--line); border-radius: 14px; font-size: .84rem; line-height: 1.45; }
    .f-who { display: block; margin-bottom: .15rem; color: var(--muted); font: 700 .6rem "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .f-q { align-self: flex-end; border-bottom-right-radius: 4px; background: var(--lime); color: #15130f; }
    .f-q .f-who { color: #4a5a00; }
    .f-a { align-self: flex-start; border-bottom-left-radius: 4px; background: var(--paper); }
    .f-call { align-self: flex-start; display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .65rem; border: 1.5px dashed rgba(var(--accent-rgb), .7); border-radius: 999px; background: rgba(var(--accent-rgb), .08); color: var(--ink); font: .72rem "JetBrains Mono", monospace; transition: border-color .3s, background-color .3s; }
    .f-call > i:first-child { color: var(--accent); }
    .f-call .f-ok { display: none; color: var(--good); }
    .f-call.done { border-style: solid; border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
    .f-call.done .f-ok { display: inline; }
    .f-call.done .f-dots { display: none; }
    .f-dax { overflow: hidden; border: 2px solid var(--line); border-radius: 12px; background: #0f1220; color: #d6deeb; box-shadow: 3px 3px 0 var(--shadow-c); transition: box-shadow .3s; }
    .f-dax.live { box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .28), 3px 3px 0 var(--shadow-c); }
    .f-dax-bar { display: flex; align-items: center; gap: .55rem; padding: .45rem .65rem; border-bottom: 1px solid #232a40; background: #151a2e; color: #b6c2d9; font: .68rem "JetBrains Mono", monospace; }
    .f-dax-bar em { margin-left: auto; color: #7f8db0; font: inherit; font-style: normal; }
    .f-dax-dots { display: inline-flex; gap: 4px; }
    .f-dax-dots i { width: 8px; height: 8px; border-radius: 50%; background: #ff5f57; }
    .f-dax-dots i:nth-child(2) { background: #febc2e; }
    .f-dax-dots i:nth-child(3) { background: #28c840; }
    .f-dax-code { padding: .65rem 0; font: 500 .72rem/1.8 "JetBrains Mono", monospace; }
    .f-dax-line { display: flex; opacity: 0; white-space: pre; }
    .f-ln { flex: none; width: 2.2rem; padding-right: .7rem; color: #4b5675; text-align: right; user-select: none; }
    .d-k { color: #c792ea; }
    .d-f { color: #82aaff; }
    .d-n { color: #f78c6c; }
    .d-c { color: #addb67; }
    .d-s { color: #ecc48d; }
    .d-m { color: #7fdbca; }
    .xp-stage-art .art-foundry { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); padding: 1rem; }
    .xp-stage-art .f-dax-code { font-size: .64rem; }
    .f-dax-code { overflow-x: auto; }
    @media (max-width: 575.98px) { .art-foundry { grid-template-columns: minmax(0, 1fr); } .f-dax-code { font-size: .66rem; } .f-chat { min-height: 0; } }

    [data-bs-theme="dark"] .fx-canvas { border-color: rgba(0, 229, 255, .3); background-color: #04030c; background-image: radial-gradient(circle, rgba(0, 229, 255, .14) 1px, transparent 1.4px); }
    [data-bs-theme="dark"] .fx-box, [data-bs-theme="dark"] .nf2-node:not(.dec) { border-color: rgba(0, 229, 255, .4); border-radius: 3px; background: linear-gradient(180deg, #0d0c24, #08071a); box-shadow: 0 0 14px rgba(0, 229, 255, .1); }
    [data-bs-theme="dark"] .fx-box.busy, [data-bs-theme="dark"] .nf2-node.running, [data-bs-theme="dark"] .nf2-node.waiting { border-color: var(--neon-m); box-shadow: 0 0 0 3px rgba(255, 43, 214, .18), 0 0 18px rgba(255, 43, 214, .35); }
    [data-bs-theme="dark"] .fx-box.fail, [data-bs-theme="dark"] .nf2-node.fail { border-color: #ff4d5e; box-shadow: 0 0 18px rgba(255, 77, 94, .35); }
    [data-bs-theme="dark"] .fx-ic, [data-bs-theme="dark"] .nf2-ic { border-radius: 2px; background: rgba(0, 229, 255, .1); color: var(--neon-c); }
    [data-bs-theme="dark"] .fx-box.fx-prefect .fx-ic { background: var(--neon-c); color: #05040f; }
    [data-bs-theme="dark"] .fx-tt b, [data-bs-theme="dark"] .nf2-tt b, [data-bs-theme="dark"] .fx-row-name b { color: #fff; }
    [data-bs-theme="dark"] .fx-row { border-radius: 2px; border-color: rgba(0, 229, 255, .22); background: #05040f; }
    [data-bs-theme="dark"] .fx-edge.on { stroke: rgba(255, 43, 214, .85); }
    [data-bs-theme="dark"] .fx-core { stroke: #05040f; }
    [data-bs-theme="dark"] .nf2-node.dec::after { background: #08071a; }
    [data-bs-theme="dark"] .nf2-node.dec::before { background: rgba(0, 229, 255, .5); }
    [data-bs-theme="dark"] .nf2-lane { background: rgba(0, 229, 255, .05); }
    [data-bs-theme="dark"] .nf2-lane.n8n { background: rgba(255, 43, 214, .05); }
    [data-bs-theme="dark"] .city-events, [data-bs-theme="dark"] .city-layer, [data-bs-theme="dark"] .nb-kpis div, [data-bs-theme="dark"] .pf-log li { border-color: rgba(0, 229, 255, .3); border-radius: 3px; background: #05040f; }
    [data-bs-theme="dark"] .city-ev-btns button { border-radius: 2px; border-color: rgba(0, 229, 255, .45); background: transparent; color: var(--neon-c); }
    [data-bs-theme="dark"] .city-ev-btns button.on { border-color: var(--neon-m); color: #fff; background: rgba(255, 43, 214, .15); }
    [data-bs-theme="dark"] .pf-fail button { border-radius: 2px; border-color: #ff4d5e; color: #ff7b88; }
    [data-bs-theme="dark"] .city-bus circle { fill: var(--neon-c); stroke: #04030c; }
    [data-bs-theme="dark"] .city-bus .bi-glyph { fill: #04030c; }
    [data-bs-theme="dark"] .city-busline { stroke: rgba(0, 229, 255, .35); }
    [data-bs-theme="dark"] .city-rain-mm, [data-bs-theme="dark"] .nb-diff { stroke: #04030c; }
    [data-bs-theme="dark"] .city-rain-mm { fill: #93c5fd; }
    [data-bs-theme="dark"] .f-win { border-color: rgba(0, 229, 255, .4); border-radius: 3px; background: #08071a; }
    [data-bs-theme="dark"] .f-bar { border-color: rgba(0, 229, 255, .3); background: #05040f; }
    [data-bs-theme="dark"] .f-avatar { border-radius: 2px; background: var(--neon-m); color: #05040f; }
    [data-bs-theme="dark"] .f-dax { border-color: rgba(0, 229, 255, .4); border-radius: 3px; background: #04030c; }

    /* mini Gêmeo ao vivo: estado dos ônibus, câmeras, área de alerta e de chuva */
    .dash-tag.live { display: inline-flex; align-items: center; gap: .35rem; border-color: var(--good); color: var(--good); }
    .city-mini .live-st text { font-size: 6px; }
    .city-mini .live-st.wait .live-st-bg { stroke-dasharray: 2 2; }
    .city-alert-r { fill: rgba(245, 158, 11, .05); stroke: rgba(245, 158, 11, .4); stroke-width: .5; stroke-dasharray: 1.6 1.6; pointer-events: none; transition: fill .4s, stroke .4s; }
    .city-alert-r.sel { fill: rgba(245, 158, 11, .14); stroke: rgba(245, 158, 11, .8); stroke-width: .8; }
    .city-alert-r.sim { fill: rgba(229, 72, 77, .1); stroke: rgba(229, 72, 77, .75); stroke-width: .8; }
    .city-rain-area { fill: rgba(59, 130, 246, .16); stroke: rgba(59, 130, 246, .55); stroke-width: .8; stroke-linejoin: round; animation: liveIn .6s ease-out; }
    .city-rain-area.sim { stroke-dasharray: 3 2; }
    .city-jam { stroke-width: 2.4; }
    .city-jam.slow { stroke-width: 3.6; }
    .city-jam.sim { stroke-dasharray: 3 2; }
    .city-alert.transito circle { fill: #f97316; }
    .city-alert.fechada circle { fill: #7c3aed; }
    .city-alert.fechada .bi-glyph, .city-alert.transito .bi-glyph { fill: #fff; }
    .city-alert.sim circle { stroke: #e5484d; stroke-width: 1.4; stroke-dasharray: 1.5 1.2; }
    .city-cam rect { fill: var(--card); stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: .9; }
    .city-cam .bi-glyph { fill: var(--ink); font-size: 5px; }
    .city-cam, .city-rain, .city-alert, .city-bus { cursor: pointer; }
    .city-bus circle { stroke-width: 1.2; }
    .city-bus.st-normal circle { fill: var(--good); }
    .city-bus.st-alert circle { fill: #f59e0b; }
    .city-bus.st-jammed circle { fill: #e5484d; }
    .city-bus.st-alert_jammed circle { fill: #a21caf; }
    .city-bus.st-none circle { fill: #9ca3af; }
    .city-bus .bi-glyph { fill: #fff; font-size: 5.4px; }
    .city-bus.sel circle { stroke: var(--ink); stroke-width: 1.8; }
    .lg-bus { background: var(--good); }
    .lg-bus.st-alert { background: #f59e0b; }
    .lg-bus.st-jammed { background: #e5484d; }
    .lg-bus.st-alert_jammed { background: #a21caf; }
    .lg-cam { border-radius: 2px !important; border: 1.5px solid var(--ink); background: var(--card); }
    .city-cycle small { color: var(--muted); font: .7rem "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .city-states { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; margin-top: .35rem; }
    .city-states div { display: grid; padding: .4rem .5rem; border: 2px solid var(--line); border-left-width: 6px; border-radius: 10px; background: var(--paper); }
    .city-states div.st-normal { border-left-color: var(--good); }
    .city-states div.st-alert { border-left-color: #f59e0b; }
    .city-states div.st-jammed { border-left-color: #e5484d; }
    .city-states div.st-alert_jammed { border-left-color: #a21caf; }
    .city-states b { font: 800 1.25rem "JetBrains Mono", monospace; line-height: 1.1; }
    .city-states span { color: var(--muted); font: .64rem/1.2 "JetBrains Mono", monospace; }
    .city-layer.sim > i { color: var(--blue); }
    .city-layer.off { border-style: dashed; opacity: .7; }
    .live-detail-head > span { display: grid; line-height: 1.25; }
    .live-detail-head small { color: var(--muted); font-size: .76rem; }
    .city-badge { display: inline-block; margin-bottom: .45rem; padding: .1rem .55rem; border-radius: 999px; background: var(--good); color: #fff; font: 700 .72rem "JetBrains Mono", monospace; }
    .city-badge.st-alert { background: #f59e0b; color: #15130f; }
    .city-badge.st-jammed { background: #e5484d; }
    .city-badge.st-alert_jammed { background: #a21caf; }
    .city-badge.st-none { background: #9ca3af; }
    .city-why { margin: .45rem 0 0; padding-left: 1.1rem; font-size: .8rem; line-height: 1.45; }
    .nb-pipe-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem; margin-bottom: .5rem; }
    .nb-pipe-head small { color: var(--muted); font: .7rem "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .pf-fail .pf-crash { border-color: var(--ink); color: var(--ink); }
    .pf-fail .pf-crash.on { background: var(--ink); color: var(--paper); }
    .pf-lane.dense i { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
    .pf-lane i.late, .pf-count i.late { border: 2px solid var(--warn); background: transparent; }
    .pf-lane i.cancelled { background: color-mix(in srgb, var(--line) 35%, transparent); }
    .pf-lane i.pending { background: color-mix(in srgb, var(--accent) 45%, transparent); }
    .pf-paused { color: var(--muted); font: italic .72rem "JetBrains Mono", monospace; }
    .fx-state.late { background: var(--warn); }
    .fx-state.cancelled { background: color-mix(in srgb, var(--line) 25%, transparent); color: var(--ink); }
    .fx-row.paused { opacity: .55; border-style: dashed; }
    .fx-row.late { border-color: var(--warn); }
    [data-bs-theme="dark"] .city-cam rect { fill: #04030c; stroke: rgba(0, 229, 255, .6); }
    [data-bs-theme="dark"] .city-cam .bi-glyph { fill: var(--neon-c); }
    [data-bs-theme="dark"] .city-states div { border-radius: 3px; background: #05040f; border-color: rgba(0, 229, 255, .3); }
    [data-bs-theme="dark"] .pf-fail .pf-crash { border-color: var(--neon-c); color: var(--neon-c); }

    /* Gêmeo ao vivo em capítulos: número, título e uma frase de contexto antes de cada cartão */
    .live-chapter { display: flex; gap: .9rem; align-items: flex-start; margin: 2.6rem 0 .9rem; }
    .live-chapter-n { flex: none; display: grid; place-items: center; width: 2.3rem; height: 2.3rem; border: 2px solid var(--line); border-radius: 50%; background: var(--accent); color: #15130f; font: 800 1.05rem "Bricolage Grotesque", sans-serif; box-shadow: 2px 2px 0 var(--shadow-c); }
    .live-chapter h4 { margin: .1rem 0 0; font: 800 1.2rem "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
    .live-chapter p { max-width: 640px; margin: .2rem 0 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
    .live-chapter + .live-card { margin-top: 0; }
    .live-head { align-items: center; }
    .city-stage { position: relative; }
    .city-banner { position: absolute; top: .6rem; left: .6rem; right: .6rem; display: flex; flex-wrap: wrap; gap: .35rem; pointer-events: none; }
    .city-banner button { pointer-events: auto; display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border: 2px solid var(--line); border-radius: 999px; background: var(--accent); color: #15130f; font: 700 .74rem "JetBrains Mono", monospace; box-shadow: 2px 2px 0 var(--shadow-c); animation: liveIn .3s ease-out; }
    .live-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .3rem; padding: .25rem; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); }
    .live-tabs button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; padding: .4rem .3rem; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 700 .78rem "DM Sans", sans-serif; transition: background-color .2s, color .2s; }
    .live-tabs button.on { background: var(--ink); color: var(--paper); }

    /* Gêmeo ao vivo: capítulos com navegação fixa, passo atual do pipeline e o pico da madrugada */
    .live-story { position: relative; margin-top: 2.6rem; }
    .live-nav { position: sticky; top: calc(var(--nav-h) + 10px); z-index: 6; display: flex; gap: .25rem; width: max-content; max-width: 100%; margin: 0 auto; padding: .3rem; border: 2px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--card) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 3px 3px 0 var(--shadow-c); }

    .fx-n { transition: background-color .7s ease, color .7s ease; position: absolute; top: calc(var(--u) * 7); right: calc(var(--u) * 7); display: grid; place-items: center; width: calc(var(--u) * 19); height: calc(var(--u) * 19); border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 calc(var(--u) * 11) "Bricolage Grotesque", sans-serif; font-style: normal; }

    .nb-now { display: flex; align-items: center; gap: .6rem; min-height: 2.6rem; margin-bottom: .8rem; padding: .45rem .7rem; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-size: .86rem; transition: border-color .3s, background-color .3s; }
    .nb-now.busy { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--paper)); }
    .nb-now.fail { border-color: #e5484d; background: color-mix(in srgb, #e5484d 7%, var(--paper)); }
    .nb-clock { flex: none; color: var(--muted); font: .74rem "JetBrains Mono", monospace; }
    .nb-now-n { flex: none; display: grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 .74rem "Bricolage Grotesque", sans-serif; transition: background-color .3s; }
    .nb-now.busy .nb-now-n { background: var(--accent); color: #15130f; }
    .nb-now.fail .nb-now-n { background: #e5484d; color: #fff; }

    .nb-peak { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 1.2rem; align-items: center; margin-top: 1.2rem; padding-top: 1.1rem; border-top: 2px dashed color-mix(in srgb, var(--line) 30%, transparent); }

    .nb-eq span.hl b { color: var(--accent); }

    .nb-peak-chart figcaption { margin-top: .2rem; color: var(--muted); font: .66rem "JetBrains Mono", monospace; text-align: right; }
    .nb-night { fill: color-mix(in srgb, var(--blue) 10%, transparent); rx: 8; }
    .nb-area { fill: color-mix(in srgb, var(--blue) 12%, transparent); }

    .nb-peakline { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .55; }
    .nb-peakdot { fill: var(--blue); stroke: var(--card); stroke-width: 2; }
    .nb-nowline { stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; stroke-dasharray: 2 3; }
    .nb-gap { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
    .nb-nowdot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
    .nb-ax { fill: var(--muted); font: 10px "JetBrains Mono", monospace; }
    .nb-ax.strong { fill: var(--ink); font-weight: 700; }
    .nb-lbl { fill: var(--ink); font: 700 11px "JetBrains Mono", monospace; paint-order: stroke; stroke: var(--card); stroke-width: 3px; }
    .nb-lbl.hl { fill: var(--accent); }
    @media (max-width: 991.98px) { .nb-peak { grid-template-columns: minmax(0, 1fr); } }

    [data-bs-theme="dark"] .live-nav { border: 1px solid rgba(0, 229, 255, .4); border-radius: 3px; background: rgba(5, 4, 15, .85); box-shadow: 0 0 18px rgba(0, 229, 255, .18); }

    [data-bs-theme="dark"] .nb-now-n { border-radius: 2px; background: var(--neon-c); color: #05040f; }

    [data-bs-theme="dark"] .nb-peakdot { fill: var(--neon-c); stroke: #05040f; }
    [data-bs-theme="dark"] .nb-area, [data-bs-theme="dark"] .nb-night { fill: rgba(0, 229, 255, .08); }
    [data-bs-theme="dark"] .nb-peakline { stroke: #fff; }
    [data-bs-theme="dark"] .nb-lbl { stroke: #08071a; }
    [data-bs-theme="dark"] .nb-nowdot { stroke: #05040f; }

    /* relógio do mini Gêmeo e o caminho do dado nas falhas simuladas */
    .clock-ctl { display: inline-flex; align-items: center; gap: .2rem; margin-left: auto; padding: .15rem; border: 2px solid var(--line); border-radius: 10px; background: var(--card); }

    .clock-ctl button { min-width: 2rem; padding: .2rem .45rem; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font: 700 .76rem "JetBrains Mono", monospace; transition: background-color .2s, color .2s; }
    .clock-ctl button:hover { background: rgba(var(--accent-rgb), .12); }

    .city-breaks { position: absolute; left: .6rem; right: .6rem; bottom: .6rem; display: grid; gap: .4rem; pointer-events: none; }
    .city-break { pointer-events: auto; display: flex; align-items: center; gap: .55rem; padding: .35rem .45rem .35rem .65rem; border: 2px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 3px 3px 0 var(--shadow-c); animation: liveIn .3s ease-out; }
    .brk-head { flex: none; display: grid; width: 6.4rem; line-height: 1.15; font-size: .76rem; }
    .brk-head span { color: var(--muted); font: .64rem "JetBrains Mono", monospace; }
    .brk-x { flex: none; padding: 0 .2rem; border: 0; background: none; color: var(--muted); font-size: .78rem; }
    .brk-path { flex: 1; display: flex; align-items: center; min-width: 0; }
    .brk-node { --c: var(--good); flex: 1 1 0; display: flex; align-items: center; gap: .35rem; min-width: 0; padding: .2rem .4rem; border: 2px solid var(--c); border-radius: 9px; background: color-mix(in srgb, var(--c) 9%, var(--card)); }

    .brk-node b { overflow: hidden; font-size: .74rem; white-space: nowrap; text-overflow: ellipsis; }
    .brk-node small { overflow: hidden; color: var(--muted); font: .62rem "JetBrains Mono", monospace; white-space: nowrap; text-overflow: ellipsis; }
    .brk-node.x { --c: #e5484d; background: #e5484d; color: #fff; animation: brkBlink 1.4s ease-in-out infinite; }
    .brk-node.x > i, .brk-node.x small { color: #fff; }
    .brk-node.fail { --c: #e5484d; }
    .brk-node.retry { --c: #f59e0b; }
    .brk-node.stale { --c: #9ca3af; }
    .brk-node.fail small, .brk-node.retry small { color: var(--c); font-weight: 700; }
    .brk-link { position: relative; flex: 0 0 1.2rem; height: 2px; background: repeating-linear-gradient(90deg, var(--good) 0 4px, transparent 4px 7px); background-size: 7px 2px; animation: brkFlow .6s linear infinite; }
    .brk-link.cut { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 25%, transparent) 0 3px, transparent 3px 6px); animation: none; }
    .brk-link.first { background: repeating-linear-gradient(90deg, #e5484d 0 3px, transparent 3px 6px); }
    .brk-link i { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: #e5484d; color: #fff; font-size: .5rem; }
    @keyframes brkFlow { to { background-position: 7px 0; } }
    @keyframes brkBlink { 50% { box-shadow: 0 0 0 4px rgba(229, 72, 77, .25); } }
    .sim-wait { display: inline-flex; align-items: center; gap: .35rem; color: var(--warn); font: 700 .74rem "JetBrains Mono", monospace; }
    @media (max-width: 767.98px) { .city-break { flex-wrap: wrap; gap: .3rem .5rem; } .brk-head { width: auto; display: flex; gap: .5rem; align-items: baseline; flex: 1; } .brk-path { order: 3; flex-basis: 100%; } .brk-node > i { display: none; } .brk-link { flex-basis: .6rem; } }

    [data-bs-theme="dark"] .clock-ctl { border: 1px solid rgba(0, 229, 255, .45); border-radius: 3px; background: transparent; }
    [data-bs-theme="dark"] .clock-ctl button { border-radius: 2px; color: var(--neon-c); }
    [data-bs-theme="dark"] .clock-ctl button.on { background: var(--neon-c); color: #05040f; }
    [data-bs-theme="dark"] .city-break { border: 1px solid rgba(0, 229, 255, .4); border-radius: 3px; background: rgba(5, 4, 15, .9); box-shadow: 0 0 18px rgba(0, 229, 255, .15); }

    @media (prefers-reduced-motion: reduce) { .brk-link, .brk-node.x { animation: none; } }

    /* etiqueta do que passa em cada linha dos fluxogramas */
    .fx-tag { --tag-in: .45s; position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: max(1px, calc(var(--u) * 2)) max(5px, calc(var(--u) * 7)); border-radius: 999px; background: var(--accent); color: #15130f; font: 700 max(9px, calc(var(--u) * 10.5)) "JetBrains Mono", monospace; white-space: nowrap; pointer-events: none; box-shadow: 0 0 0 2px var(--card); animation: tagIn var(--tag-in) cubic-bezier(.2, .8, .2, 1); }
    @keyframes tagIn { from { opacity: 0; transform: translate(-50%, -30%) scale(.92); } }
    .fx-tag.read { background: var(--blue); color: #fff; }
    .fx-tag.fail { background: #e5484d; color: #fff; }
    .fx-tag.muted { background: var(--card); color: var(--muted); border: 1px dashed color-mix(in srgb, var(--line) 40%, transparent); box-shadow: none; animation: none; font-weight: 500; }
    .fx-edge.rule { stroke-dasharray: 3 5; opacity: .6; }
    .pf-now { margin: .2rem 0 .8rem; }
    .pf-toolbar .clock-ctl { margin-left: 0; }
    [data-bs-theme="dark"] .fx-tag { border-radius: 2px; background: var(--neon-c); color: #05040f; box-shadow: 0 0 0 2px #05040f; }
    [data-bs-theme="dark"] .fx-tag.read { background: #60a5fa; }

    [data-bs-theme="dark"] .fx-tag.muted { background: #05040f; color: rgba(255, 255, 255, .6); border-color: rgba(0, 229, 255, .35); }

    /* log em terminal, linha do tempo dos snapshots e tabela por minuto */
    .nb-ops { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1rem; margin-top: 1rem; align-items: stretch; }
    .nb-ops > .nb-snaps { align-self: start; }

    @media (max-width: 991.98px) { .nb-ops { grid-template-columns: minmax(0, 1fr); } .nb-ops-side .flow-log { flex: none; } .nb-ops-side .flow-log ol { max-height: 14rem; } }
    /* execuções no Prefect: o resumo da orquestração, ao lado dos snapshots */
    .nb-runs { padding: .9rem 1rem .8rem; border: 2px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 4px 4px 0 var(--shadow-c); }
    .nb-runs-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; }
    .nb-runs-head span { font: 700 .82rem "JetBrains Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
    .nb-runs-head span i { margin-right: .35rem; color: var(--accent); }
    .nb-runs-head small, .nb-runs-axis { color: var(--muted); font: .68rem "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .nb-runs-txt { margin: .35rem 0 .5rem; color: var(--muted); font-size: .84rem; line-height: 1.45; }
    .nb-runs .pf-lane { grid-template-columns: 7.2rem minmax(0, 1fr); }
    .nb-runs .pf-lane > span small { margin-left: .4rem; color: var(--muted); font-weight: 400; font-size: .68rem; }
    .nb-runs .pf-lane i.running { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); animation: nbRunPulse 1.2s ease-in-out infinite; }
    .nb-runs .pf-lane.dense i.running { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
    @keyframes nbRunPulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }
    .nb-runs-axis { display: flex; justify-content: space-between; margin: .1rem 0 0 7.8rem; }
    .pf-count i.running { background: var(--accent); }
    @media (max-width: 575.98px) { .nb-runs .pf-lane { grid-template-columns: 5.6rem minmax(0, 1fr); } .nb-runs .pf-lane > span small { display: none; } .nb-runs-axis { margin-left: 6.2rem; } }
    .flow-log { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 2px solid var(--line); border-radius: 14px; background: #0f1220; color: #d6deeb; box-shadow: 4px 4px 0 var(--shadow-c); }
    .flow-log-head { padding: .55rem .8rem; }
    .flow-log-clock { margin-left: auto; color: #6b7f99; }
    .flow-log ol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: .1rem; min-height: 10.2rem; margin: 0; padding: .6rem .8rem .7rem; list-style: none; font: .72rem/1.5 "JetBrains Mono", monospace; }
    .flow-log li { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr); gap: .55rem; align-items: baseline; animation: lineIn .35s cubic-bezier(.2, .7, .2, 1); }
    .flow-log time { color: #4b5b75; }
    .flow-log li b { min-width: 4.2em; color: #82aaff; font-weight: 700; }
    .flow-log .src { color: #c792ea; }
    .flow-log .msg { overflow: hidden; color: #d6deeb; white-space: nowrap; text-overflow: ellipsis; }
    .flow-log .msg em { color: #ffcb6b; font-style: normal; }
    .flow-log li.lv-ok b { color: #c3e88d; }
    .flow-log li.lv-warning b { color: #ffcb6b; }
    .flow-log li.lv-error b, .flow-log li.lv-error .msg { color: #ff5f57; }
    .flow-log li.lv-muted .msg { color: #6b7f99; }
    @media (max-width: 575.98px) { .flow-log ol { min-height: 9.5rem; font-size: .66rem; } .flow-log li { grid-template-columns: auto auto minmax(0, 1fr); gap: .4rem; } .flow-log li:nth-last-child(n+7) { display: none; } .flow-log .src { display: none; } }

    .nb-pg { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 4); min-height: 0; }
    .nb-pg > b { font: 800 calc(var(--u) * 38) / 1 "Bricolage Grotesque", sans-serif; color: var(--ink); }
    .nb-pg > small { color: var(--muted); font: calc(var(--u) * 10.5) "JetBrains Mono", monospace; }
    .nb-slots-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
    .nb-slots-row i { height: 22px; border-radius: 3px; background: var(--blue); transition: background-color 1.2s cubic-bezier(.45, 0, .55, 1), opacity 1.1s ease; }
    .nb-slots.mini .nb-slots-row { gap: 1px; margin-top: calc(var(--u) * 6); }
    .nb-slots.mini .nb-slots-row i { height: calc(var(--u) * 26); border-radius: 1px; }
    .nb-slots-row i.lag { background: repeating-linear-gradient(135deg, var(--blue) 0 3px, color-mix(in srgb, var(--blue) 35%, transparent) 3px 6px); }
    .nb-slots-row i.old { background: color-mix(in srgb, var(--blue) 25%, transparent); }
    .nb-slots-row i.miss { background: none; border: 1.5px dashed #e5484d; }
    .nb-slots-row i.future, .nb-slots-row i.gone { background: none; border: 1.5px dashed color-mix(in srgb, var(--line) 22%, transparent); }
    .nb-slots.reading .nb-slots-row i.win { background: var(--accent); }
    .nb-slots.clearing .nb-slots-row i.old { opacity: 0; transition-duration: var(--fade, 1s); transition-delay: 0s !important; }
    .nb-slots-ax { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-top: .25rem; }
    .nb-slots-ax span { overflow: visible; color: var(--muted); font: .62rem "JetBrains Mono", monospace; white-space: nowrap; }
    .nb-snaps { display: grid; gap: .6rem; align-content: start; min-width: 0; padding: .9rem 1rem; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); }
    .nb-snaps-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .2rem .8rem; }
    .nb-snaps-head .nb-cap { margin: 0; }
    .nb-snaps-head span { color: var(--muted); font: .72rem "JetBrains Mono", monospace; }
    .nb-snaps-head b { color: var(--ink); }
    .nb-slots-key { display: flex; flex-wrap: wrap; gap: .25rem .8rem; color: var(--muted); font-size: .72rem; }
    .nb-slots-key span { display: inline-flex; align-items: center; gap: .3rem; }
    .nb-slots-key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--blue); }
    .nb-slots-key i.lag { background: repeating-linear-gradient(135deg, var(--blue) 0 3px, color-mix(in srgb, var(--blue) 35%, transparent) 3px 6px); }
    .nb-slots-key i.old { background: color-mix(in srgb, var(--blue) 25%, transparent); }
    .nb-slots-key i.miss { background: none; border: 1.5px dashed #e5484d; }
    .nb-min { width: 100%; border-collapse: collapse; font: .78rem "JetBrains Mono", monospace; }
    .nb-min th { padding: .3rem 0; color: var(--muted); font-size: .64rem; font-weight: 500; letter-spacing: .08em; text-align: right; text-transform: uppercase; border-bottom: 1px solid color-mix(in srgb, var(--line) 25%, transparent); }
    .nb-min td { padding: .28rem 0; text-align: right; border-bottom: 1px dashed color-mix(in srgb, var(--line) 14%, transparent); }
    .nb-min th:first-child, .nb-min td:first-child { text-align: left; }
    .nb-min td.o { color: #e5484d; }
    .nb-min td.i { color: var(--good); }
    .nb-min tfoot td { border-bottom: 0; font-weight: 800; }
    .nb-snaps-foot { color: var(--muted); font-size: .68rem; }
    .pf-n { color: var(--muted); font-style: normal; }

    [data-bs-theme="dark"] .flow-log { border: 1px solid rgba(0, 229, 255, .4); border-radius: 3px; background: #04030c; box-shadow: 0 0 18px rgba(0, 229, 255, .12); }
    [data-bs-theme="dark"] .nb-snaps { border: 1px solid rgba(0, 229, 255, .3); border-radius: 3px; background: #05040f; }
    [data-bs-theme="dark"] .nb-slots-row i, [data-bs-theme="dark"] .nb-slots-key i { background: var(--neon-c); }
    [data-bs-theme="dark"] .nb-slots-row i.old, [data-bs-theme="dark"] .nb-slots-key i.old { background: rgba(0, 229, 255, .22); }
    [data-bs-theme="dark"] .nb-slots-row i.lag, [data-bs-theme="dark"] .nb-slots-key i.lag { background: repeating-linear-gradient(135deg, var(--neon-c) 0 3px, rgba(0, 229, 255, .25) 3px 6px); }
    [data-bs-theme="dark"] .nb-slots.reading .nb-slots-row i.win { background: var(--neon-m); }
    [data-bs-theme="dark"] .nb-pg > b { color: #fff; font-family: "Orbitron", sans-serif; }

    /* cartões curtos de cada bloco do fluxo do NitBike */
    .nb-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .5rem; margin: .9rem 0 0; padding: 0; list-style: none; }
    .nb-legend button { display: flex; align-items: flex-start; gap: .55rem; width: 100%; height: 100%; padding: .55rem .65rem; border: 2px solid color-mix(in srgb, var(--line) 22%, transparent); border-radius: 12px; background: var(--paper); color: var(--ink); text-align: left; transition: border-color .9s ease, background-color .9s ease, transform .15s; }
    .nb-legend button:hover { transform: translateY(-1px); border-color: var(--line); }
    .nb-legend-n { flex: none; display: grid; place-items: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 .74rem "Bricolage Grotesque", sans-serif; transition: background-color .9s ease, color .9s ease; }
    .nb-legend b { display: block; font-size: .82rem; line-height: 1.2; }
    .nb-legend small { display: block; margin-top: .15rem; color: var(--muted); font-size: .74rem; line-height: 1.4; }
    .nb-legend li.on button { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--paper)); }
    .nb-legend li.on .nb-legend-n { background: var(--accent); color: #15130f; }
    .nb-legend li.fail button { border-color: #e5484d; background: color-mix(in srgb, #e5484d 7%, var(--paper)); }
    .nb-legend li.fail .nb-legend-n { background: #e5484d; color: #fff; }
    .nb-legend li.sel button { border-color: var(--line); border-style: dashed; }
    .city-alert.dot circle { stroke-width: .9; }
    .nb-snaps-tx { margin: -.2rem 0 0; color: var(--muted); font-size: .78rem; line-height: 1.45; }
    @media (max-width: 575.98px) { .nb-legend { grid-template-columns: minmax(0, 1fr); } }
    [data-bs-theme="dark"] .nb-legend button { border: 1px solid rgba(0, 229, 255, .25); border-radius: 3px; background: #05040f; color: #fff; }
    [data-bs-theme="dark"] .nb-legend-n { border-radius: 2px; background: rgba(0, 229, 255, .2); color: var(--neon-c); }
    [data-bs-theme="dark"] .nb-legend li.on button { border-color: var(--neon-m); background: rgba(255, 43, 214, .08); }
    [data-bs-theme="dark"] .nb-legend li.on .nb-legend-n { background: var(--neon-m); color: #05040f; }

    /* linha do tempo deslizante dos snapshots e a conta de entradas e saídas */
    .nb-tl { position: relative; padding-bottom: 2.2rem; }
    .nb-tl-track { position: relative; height: 54px; overflow: hidden; border-radius: 8px; background: color-mix(in srgb, var(--line) 5%, transparent); }
    .nb-tl-track > i { position: absolute; top: 20px; height: 24px; box-sizing: border-box; border: 1px solid var(--paper); border-radius: 4px; background: var(--blue); animation: slotIn .6s cubic-bezier(.2, .8, .2, 1); transition: opacity .9s ease, transform .9s ease, background-color .5s; }
    .nb-tl-track > i.lag { background: repeating-linear-gradient(135deg, var(--blue) 0 3px, color-mix(in srgb, var(--blue) 35%, transparent) 3px 6px); }
    .nb-tl-track > i.old { background: color-mix(in srgb, var(--blue) 30%, transparent); }
    .nb-tl-track > i.old.dying { opacity: 0; transform: translateY(14px) scale(.5); }
    .nb-tl-track > i.miss { background: none; border: 1.5px dashed #e5484d; animation: none; }
    .nb-tl.reading .nb-tl-track > i.win { background: var(--accent); }
    @keyframes slotIn { from { opacity: 0; transform: translateY(-10px) scale(.6); } }
    .nb-tl-win, .nb-tl-lag, .nb-tl-old { position: absolute; top: 0; bottom: 0; box-sizing: border-box; pointer-events: none; }
    .nb-tl-win { border: 2px solid var(--ink); border-radius: 8px; background: color-mix(in srgb, var(--blue) 7%, transparent); }
    .nb-tl-win.prev { border: 2px dashed color-mix(in srgb, var(--ink) 45%, transparent); background: none; animation: fadeOut 3.5s ease-in forwards; }
    .nb-tl-lag { border-radius: 0 8px 8px 0; background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--blue) 10%, transparent) 4px 8px); }
    .nb-tl-old { background: color-mix(in srgb, var(--paper) 45%, transparent); }
    .nb-tl-track em { position: absolute; top: 3px; left: 6px; color: var(--muted); font: 700 .58rem "JetBrains Mono", monospace; font-style: normal; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .nb-tl-win em { color: var(--ink); }
    .nb-tl-lag em { left: 2px; }
    .nb-tl-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent); }
    .nb-tl-now em { top: auto !important; bottom: 2px; left: 4px !important; color: var(--accent) !important; }
    .nb-tl-ax { position: absolute; left: 0; right: 0; bottom: 1.1rem; height: 1rem; }
    .nb-tl-reads { position: absolute; left: 0; right: 0; bottom: 0; height: 1rem; }
    .nb-tl-reads span { position: absolute; transform: translateX(-50%); padding: 0 .3rem; border-radius: 999px; background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); font: 700 .56rem "JetBrains Mono", monospace; white-space: nowrap; transition: left .3s linear; }
    .nb-tl-reads span.r5 { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--muted); }
    .nb-tl-reads span.r0 { background: none; border: 1px dashed color-mix(in srgb, var(--blue) 50%, transparent); }
    [data-bs-theme="dark"] .nb-tl-reads span { border-radius: 2px; background: rgba(0, 229, 255, .12); color: var(--neon-c); }
    [data-bs-theme="dark"] .nb-tl-reads span.r5 { background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .6); }
    .nb-tl-ax span { position: absolute; transform: translateX(-50%); color: var(--muted); font: .6rem "JetBrains Mono", monospace; white-space: nowrap; }
    @keyframes fadeOut { to { opacity: 0; } }
    .nb-slots-key i.prev { background: none; border: 1.5px dashed color-mix(in srgb, var(--ink) 50%, transparent); }
    .nb-math { display: grid; gap: .5rem; padding-top: .6rem; border-top: 1px dashed color-mix(in srgb, var(--line) 25%, transparent); }
    .nb-math-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; align-items: baseline; }
    .nb-math-row small { color: var(--muted); font: .64rem "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .nb-math-row b { grid-row: span 2; align-self: center; font: 800 1rem "JetBrains Mono", monospace; text-align: right; white-space: nowrap; }
    .nb-math-row em { color: var(--muted); font: .72rem/1.35 "DM Sans", sans-serif; font-style: normal; }
    .nb-math .i { color: var(--good); }
    .nb-math .o { color: #e5484d; }
    .nb-saldo { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .nb-saldo > div { display: grid; gap: .15rem; align-content: start; }
    .nb-saldo small { color: var(--muted); font: .62rem "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .nb-saldo span { display: flex; justify-content: space-between; gap: .5rem; overflow: hidden; font-size: .76rem; white-space: nowrap; }
    .nb-saldo span b { font-family: "JetBrains Mono", monospace; }
    [data-bs-theme="dark"] .nb-tl-track { border-radius: 2px; background: rgba(0, 229, 255, .04); }
    [data-bs-theme="dark"] .nb-tl-track > i { border-color: #05040f; border-radius: 1px; background: var(--neon-c); }
    [data-bs-theme="dark"] .nb-tl-track > i.old { background: rgba(0, 229, 255, .25); }
    [data-bs-theme="dark"] .nb-tl-track > i.lag { background: repeating-linear-gradient(135deg, var(--neon-c) 0 3px, rgba(0, 229, 255, .25) 3px 6px); }
    [data-bs-theme="dark"] .nb-tl.reading .nb-tl-track > i.win { background: var(--neon-m); }
    [data-bs-theme="dark"] .nb-tl-win { border-color: #fff; border-radius: 2px; }
    [data-bs-theme="dark"] .nb-tl-win em { color: #fff; }
    [data-bs-theme="dark"] .nb-tl-old { background: rgba(5, 4, 15, .5); }
    @media (prefers-reduced-motion: reduce) { .nb-tl-track > i { animation: none; transition: none; } }

    /* quantos snapshots há no banco e de que parte cada um é */
    .nb-count { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
    .nb-count span { display: grid; padding: .3rem .55rem; border: 2px solid var(--line); border-radius: 10px; background: var(--card); line-height: 1.1; }
    .nb-count b { font: 800 1.05rem "JetBrains Mono", monospace; }
    .nb-count small { color: var(--muted); font-size: .66rem; }
    .nb-count span.old { border-color: color-mix(in srgb, var(--blue) 35%, transparent); }
    .nb-count span.win { border-color: var(--blue); }
    .nb-count span.win b { color: var(--blue); }
    .nb-count span.lag { border-style: dashed; border-color: var(--blue); }
    .nb-count i { color: var(--muted); font: 800 .9rem "JetBrains Mono", monospace; font-style: normal; }
    [data-bs-theme="dark"] .nb-count span { border: 1px solid rgba(0, 229, 255, .3); border-radius: 3px; background: #05040f; }
    [data-bs-theme="dark"] .nb-count span.win b { color: var(--neon-c); }

    /* mini Gêmeo: ferramentas do mapa em grupos de mesma altura e a faixa de simulação */
    .map-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .7rem; }
    .seg { display: inline-flex; align-items: stretch; gap: 2px; height: 36px; padding: 3px; border: 2px solid var(--line); border-radius: 11px; background: var(--card); box-shadow: 2px 2px 0 var(--shadow-c); }
    .seg button { display: inline-flex; align-items: center; gap: .4rem; padding: 0 .7rem; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 700 .76rem "DM Sans", sans-serif; white-space: nowrap; transition: background-color .25s, color .25s; }
    .seg button:hover { color: var(--ink); background: color-mix(in srgb, var(--line) 6%, transparent); }
    .seg button.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); }
    .map-layers button i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; opacity: .35; transition: opacity .25s; }
    .map-layers button.on i { opacity: 1; }
    .map-tools .clock-ctl { margin-left: 0; height: 36px; padding: 3px; border-radius: 11px; box-shadow: 2px 2px 0 var(--shadow-c); }
    .map-tools .clock-ctl small { display: inline-flex; align-items: center; gap: .3rem; }
    .map-tools .clock-ctl button { min-width: 2.2rem; padding: 0 .5rem; font-family: "JetBrains Mono", monospace; }
    .map-tools .clock-ctl button.on { background: var(--ink); color: var(--paper); }
    @media (max-width: 575.98px) { .map-tools { gap: .4rem; } .seg { height: 34px; max-width: 100%; } .seg.map-layers { flex-wrap: wrap; height: auto; width: 100%; } .map-layers button { height: 28px; padding: 0 .55rem; } }

    .sim-row { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .9rem; margin-top: 1.1rem; padding: .8rem 1rem; overflow: hidden; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); transition: border-color .5s, background-color .5s; }
    .sim-row-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: rgba(229, 72, 77, .12); color: #e5484d; font-size: 1.15rem; transition: background-color .5s, color .5s; }
    .sim-row-tx { display: grid; gap: .1rem; min-width: 0; }
    .sim-row-tx small { color: var(--muted); font: 700 .64rem "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .sim-row-tx b { font-size: .95rem; }
    .sim-row-tx span { color: var(--muted); font-size: .8rem; line-height: 1.4; }
    .sim-row-btn { --bs-btn-padding-y: .55rem; --bs-btn-padding-x: 1rem; font-size: .84rem; white-space: nowrap; }
    .sim-row.on { border-color: #e5484d; background: color-mix(in srgb, #e5484d 6%, var(--paper)); }
    .sim-row.on .sim-row-ic { background: #e5484d; color: #fff; }
    .sim-row-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #e5484d; transform-origin: left; transition: transform 1s linear; }
    @media (max-width: 575.98px) { .sim-row { grid-template-columns: auto minmax(0, 1fr); } .sim-row-btn { grid-column: 1 / -1; justify-content: center; } }

// Lê as camadas públicas, cada uma no seu ritmo, enquanto o mapa está na tela.
function useCityLive(on) {
  const [data, setData] = useState({});
  useEffect(() => {
    if (!on) return;
    let dead = false;
    const load = async k => {
      try {
        const r = await fetch(LIVE_URLS[k]);
        if (!r.ok) throw new Error(String(r.status));
        const j = await r.json();
        if (j.error || !j.features) throw new Error("camada indisponível");
        if (!dead) setData(d => ({
          ...d,
          [k]: {
            rows: j.features,
            at: Date.now(),
            error: false
          }
        }));
      } catch (e) {
        if (!dead) setData(d => ({
          ...d,
          [k]: {
            ...(d[k] || {}),
            error: true
          }
        }));
      }
    };
    const timers = Object.keys(LIVE_URLS).map(k => {
      load(k);
      return setInterval(() => load(k), LIVE_EVERY[k] * 1000);
    });
    return () => {
      dead = true;
      timers.forEach(clearInterval);
    };
  }, [on]);
  return data;
}

// Transforma as linhas das camadas no que o mapa e o painel usam.
function parseCity(raw) {
  const out = {
    nb: null,
    alerts: null,
    jams: null,
    rain: null
  };
  if (raw.nitbike && raw.nitbike.rows) {
    const by = {};
    let test = null,
      at = 0;
    raw.nitbike.rows.forEach(({
      attributes: a
    }) => {
      const r = {
        bikes: a.si_bikeAvailable || 0,
        vagas: a.si_positionAvailable || 0,
        ent: a.i_total_entrada || 0,
        sai: a.i_total_saidas || 0,
        flux: a.i_total_fluxo || 0,
        rE: a.i_rank_entrada,
        rS: a.i_rank_saida,
        rF: a.i_rank_fluxo
      };
      at = Math.max(at, a.dt_atualizado || 0);
      if (a.si_stationNumber === 901) test = r;else by[a.si_stationNumber] = r;
    });
    const list = NB_REAL.map(([n, name]) => ({
      n,
      name,
      ...(by[n] || {})
    })).filter(s => s.bikes !== undefined);
    // na estação de teste: si_bikeAvailable é o pico e i_total_fluxo, as bikes rodando (pico − total do subflow);
    // o total que o subflow somou na API sai da diferença entre os dois
    const total = list.reduce((s, x) => s + x.bikes, 0);
    out.nb = {
      by,
      at,
      list,
      total,
      vagas: list.reduce((s, x) => s + x.vagas, 0),
      rodando: test ? test.flux : null,
      frota: test ? test.bikes : null,
      subTotal: test ? test.bikes - test.flux : null
    };
  }
  if (raw.alertas && raw.alertas.rows) {
    out.alerts = raw.alertas.rows.map(({
      attributes: a
    }) => {
      const [kind, glyph] = wazeKind(a.tx_tipo_alerta || "", a.tx_subtipo_alerta || "");
      return {
        pt: geoToMap(a.db_long, a.db_lat),
        kind,
        glyph,
        rua: a.tx_rua || "via sem nome",
        tipo: a.tx_subtipo_alerta || a.tx_tipo_alerta,
        since: a.dt_entrada,
        at: a.dt_data_hora
      };
    }).filter(a => a.pt[0] > 0);
    out.alertsAt = raw.alertas.at;
  }
  if (raw.trafego && raw.trafego.rows) {
    out.jams = raw.trafego.rows.flatMap(({
      attributes: a,
      geometry: g
    }) => (g && g.paths ? g.paths : []).map(p => ({
      pts: p.map(([x, y]) => geoToMap(x, y)),
      level: a.li_nivel || 1,
      kmh: a.db_velocidade_kmh,
      rua: a.tx_rua || "via sem nome"
    })));
    out.jamsAt = raw.trafego.at;
  }
  if (raw.chuva && raw.chuva.rows) {
    const by = {};
    let when = "";
    raw.chuva.rows.forEach(({
      attributes: a
    }) => {
      by[a.tx_estacao] = {
        mm: a.fl_ppnow || 0,
        h1: a.fl_pp1h || 0
      };
      when = a.dt_data || when;
    });
    out.rain = {
      by,
      when: when.split(" ")[1] || when
    };
  }
  return out;
}

    id: `${r[0]}-0`,
    ri,

    v: 0.85 + rnd() * 0.3

    buses,
    shown: buses.map(b => ({
      id: b.id,
      ri: b.ri,
      p: polyAt(BUS_ROUTES[b.ri][2], b.s / BUS_LEN[b.ri]),

    const slow = sim.shown[k] && (sim.shown[k].status === "jammed" || sim.shown[k].status === "alert_jammed") ? 0.3 : 1;
    b.s += b.dir * 0.48 * ctx.speed * b.v * slow * dt;
    const len = BUS_LEN[b.ri];
    if (b.s > len) {
      b.s = 2 * len - b.s;
      b.dir = -1;

      b.s = -b.s;
      b.dir = 1;
    }

    if (Date.now() - sim.cycleAt > 60000 / ctx.speed) sim.shown = sim.shown.map(b => ({
      ...b,
      status: "none",
      changed: b.status !== "none",
      why: ["cruzamento fora: o cache de 60 s expirou"]

    return;
  }

  sim.shown = sim.buses.map((b, k) => {
    const p = polyAt(BUS_ROUTES[b.ri][2], b.s / BUS_LEN[b.ri]);
    const near = (ctx.alerts || []).find(a => Math.hypot(a.pt[0] - p[0], a.pt[1] - p[1]) <= CROSS.alert);
    const jam = slowSegs.find(j => ptLineDist(p, j.pts) <= CROSS.jam);

    const status = busStatus(!!near, !!jam, mm > CROSS.rain);

      id: b.id,
      ri: b.ri,
      p,
      status,
      changed: !!prev[k] && prev[k].status !== status,
      why,
      gauge: g[0],
      mm

// trânsito e viagens entre estações são ilustrativos. A seção fica presa na tela enquanto a rolagem separa as
// placas, gira a câmera em volta da pilha e destaca a camada da vez. A câmera se afasta o quanto precisa para a
